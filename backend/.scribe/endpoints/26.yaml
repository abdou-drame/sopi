        description: 'Mobile sénégalais (Wave ou Orange Money) qui reçoit le versement. Must match the regex /^\+2217[05678]\d{7}$/.'
        required: true
        example: '771234567'
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
