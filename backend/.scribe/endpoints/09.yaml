name: 'Administration — retraits'
description: |-

  Routes de lecture réservées aux administrateurs (jeton Sanctum + rôle `administrateur`). Montants en FCFA entiers.
endpoints:
  -
    custom: []
    httpMethods:
      - GET
    uri: api/v1/admin/retraits
    metadata:
      custom: []
      groupName: 'Administration — retraits'
      groupDescription: |-

        Routes de lecture réservées aux administrateurs (jeton Sanctum + rôle `administrateur`). Montants en FCFA entiers.
      subgroup: ''
      subgroupDescription: ''
      title: 'Liste des retraits'
      description: |-
        Retraits des prestataires, du plus récent au plus ancien (20 par page). Filtres combinables : `statut`, `prestataire`
        (identifiant du profil prestataire) et `bloques` (retraits en_cours depuis plus longtemps que le délai de blocage : point
        d'arrivée de l'alerte `retraits_bloques`). Le téléphone de versement est masqué dans la liste ; la référence DexPay n'apparaît
        que dans le détail.
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {VOTRE_JETON}'
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters:
      statut:
        custom: []
        name: statut
        description: 'en_cours, reussi ou echoue.'
        required: false
        example: en_cours
        type: string
        enumValues:
          - en_cours
          - reussi
          - echoue
        exampleWasSpecified: false
        nullable: true
        deprecated: false
      prestataire:
        custom: []
        name: prestataire
        description: 'Identifiant du profil prestataire. validation.uuid.'
        required: false
        example: 0198a1b2-0000-7000-8000-000000000012
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: true
        deprecated: false
      bloques:
        custom: []
        name: bloques
        description: "true : retraits en_cours depuis plus longtemps que le délai de blocage (point d'arrivée de l'alerte `retraits_bloques`) ; false : tous les autres."
        required: false
        example: true
        type: boolean
        enumValues: []
        exampleWasSpecified: false
        nullable: true
        deprecated: false
      page:
        custom: []
        name: page
        description: 'Numéro de page (20 résultats par page). Le champ value doit être au moins égal à 1.'
        required: false
        example: 1
        type: integer
        enumValues: []
        exampleWasSpecified: false
        nullable: true
        deprecated: false
    cleanQueryParameters:
      statut: en_cours
      prestataire: 0198a1b2-0000-7000-8000-000000000012
      bloques: true
      page: 1
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: '{"data":[{"id":"0198a1b2-0000-7000-8000-000000000080","prestataire":{"id":"0198a1b2-0000-7000-8000-000000000012","userId":"0198a1b2-0000-7000-8000-000000000002","nomEntreprise":"Garage Exemple"},"montant":5000,"statut":"en_cours","bloque":true,"dateDemande":"2030-01-20T08:00:00+00:00","traiteLe":null,"recredite":false,"telephoneVersement":"+221*******67"}],"links":{"first":"https://api.exemple.test/api/v1/admin/retraits?page=1","last":"https://api.exemple.test/api/v1/admin/retraits?page=1","prev":null,"next":null},"meta":{"current_page":1,"last_page":1,"per_page":20,"total":1}}'
        headers: []
        description: ''
      -
        custom: []
        status: 401
        content: '{"message":"Authentification requise."}'
        headers: []
        description: ''
      -
        custom: []
        status: 403
        content: '{"message":"Vous n''avez pas le droit d''effectuer cette action."}'
        headers: []
        description: ''
      -
        custom: []
        status: 422
        content: '{"message":"Le statut doit être en_cours, reussi ou echoue.","errors":{"statut":["Le statut doit être en_cours, reussi ou echoue."]}}'
        headers: []
        description: ''
    responseFields: []
    auth:
      - headers
      - Authorization
      - 'Bearer JETON_FICTIF'
    controller: null
    method: null
    route: null
