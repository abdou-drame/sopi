name: 'Référentiels publics'
description: |-

  Listes utilisées par l'application avant la connexion (accueil, filtres, inscription d'un prestataire).
endpoints:
  -
    custom: []
    httpMethods:
      - GET
    uri: api/v1/metiers
    metadata:
      custom: []
      groupName: 'Référentiels publics'
      groupDescription: |-

        Listes utilisées par l'application avant la connexion (accueil, filtres, inscription d'un prestataire).
      subgroup: ''
      subgroupDescription: ''
      title: 'Lister les métiers'
      description: |-
        Métiers actifs uniquement, triés par nom. Sans authentification. Le `code` est la valeur à passer aux filtres
        (`GET /prestataires?metier=`) et à l'inscription d'un prestataire. Aucune icône n'est stockée : l'application en associe une au code.
      authenticated: false
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: '{"data":[{"id":"0198a1b2-0000-7000-8000-000000000010","code":"coiffure","nom":"Coiffure"},{"id":"0198a1b2-0000-7000-8000-000000000011","code":"mecanique","nom":"Mécanique"}]}'
        headers: []
        description: ''
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
  -
    custom: []
    httpMethods:
      - GET
    uri: api/v1/quartiers
    metadata:
      custom: []
      groupName: 'Référentiels publics'
      groupDescription: ''
      subgroup: ''
      subgroupDescription: ''
      title: 'Lister les quartiers'
      description: |-
        Quartiers où au moins un prestataire au compte actif est installé, sans doublon (casse et espaces superflus ignorés), triés
        par ordre alphabétique. Sans authentification. Il n'existe pas de table des quartiers : la liste vient des profils.
        Passez la valeur telle quelle au filtre `GET /prestataires?quartier=`.
      authenticated: false
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: '{"data":["Jaxaay","Keur Massar Nord","Malika"]}'
        headers: []
        description: ''
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
