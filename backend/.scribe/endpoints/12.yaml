        description: 'Description du problème, de 10 à 1000 caractères. Le champ value doit contenir au moins 10 caractères. Le champ value ne doit pas dépasser 1000 caractères.'
        required: true
        example: "Le prestataire ne s'est pas présenté au rendez-vous."
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      preuves:
        custom: []
        name: preuves
        description: 'Must be a file. Le fichier ne doit pas dépasser 5120 Ko.'
        required: false
        example:
          - null
        type: 'file[]'
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
    cleanBodyParameters:
