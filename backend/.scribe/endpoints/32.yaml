name: Authentification
description: ''
endpoints:
  -
    custom: []
    httpMethods:
      - POST
    uri: api/v1/auth/mot-de-passe-oublie
    metadata:
      custom: []
      groupName: Authentification
      groupDescription: ''
      subgroup: ''
      subgroupDescription: ''
      title: 'Mot de passe oublié'
      description: |-
        Envoie un lien de réinitialisation (valable 60 minutes, usage unique) à l'adresse e-mail d'un compte actif. La réponse est
        toujours la même, que l'adresse corresponde à un compte ou non (compte inconnu, sans e-mail, suspendu, banni, en attente,
        refusé ou administrateur : aucun e-mail n'est envoyé). Limité par adresse IP et par adresse e-mail.
      authenticated: false
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      email:
        custom: []
        name: email
        description: 'Adresse e-mail du compte. Le champ value doit être une adresse e-mail valide. Le champ value ne doit pas dépasser 255 caractères.'
        required: true
        example: awa@example.com
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
    cleanBodyParameters:
      email: awa@example.com
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: '{"message":"Si un compte correspond à cette adresse, un lien de réinitialisation vient d''être envoyé."}'
        headers: []
        description: ''
      -
        custom: []
        status: 422
        content: '{"message":"L''adresse e-mail n''est pas valide.","errors":{"email":["L''adresse e-mail n''est pas valide."]}}'
        headers: []
        description: ''
      -
        custom: []
        status: 429
        content: '{"message":"Trop de tentatives. Réessayez dans quelques instants."}'
        headers: []
        description: ''
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
  -
    custom: []
    httpMethods:
      - POST
    uri: api/v1/auth/reinitialiser-mot-de-passe
    metadata:
      custom: []
      groupName: Authentification
      groupDescription: ''
      subgroup: ''
      subgroupDescription: ''
      title: 'Réinitialiser le mot de passe'
      description: |-
        Choisit un nouveau mot de passe avec le jeton du lien reçu par e-mail (valable 60 minutes, usage unique). Tous les appareils
        du compte sont déconnectés et un e-mail de confirmation est envoyé.
      authenticated: false
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      jeton:
        custom: []
        name: jeton
        description: 'Jeton contenu dans le lien reçu par e-mail. Le champ value ne doit pas dépasser 200 caractères.'
        required: true
        example: jeton-recu-par-email
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      mot_de_passe:
        custom: []
        name: mot_de_passe
        description: 'Nouveau mot de passe (8 caractères minimum). Le champ value doit contenir au moins 8 caractères. Le champ value ne doit pas dépasser 255 caractères.'
        required: true
        example: nouveau-mot-de-passe
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
    cleanBodyParameters:
      jeton: jeton-recu-par-email
      mot_de_passe: nouveau-mot-de-passe
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: '{"message":"Votre mot de passe a été modifié. Vous pouvez vous reconnecter."}'
        headers: []
        description: ''
      -
        custom: []
        status: 422
        content: '{"message":"Ce lien est invalide, expiré ou déjà utilisé. Faites une nouvelle demande de réinitialisation.","errors":{"jeton":["Ce lien est invalide, expiré ou déjà utilisé. Faites une nouvelle demande de réinitialisation."]}}'
        headers: []
        description: ''
      -
        custom: []
        status: 429
        content: '{"message":"Trop de tentatives. Réessayez dans quelques instants."}'
        headers: []
        description: ''
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
