name: 'Client — recherche de prestataires'
description: |-

  Routes réservées aux clients (jeton Sanctum + rôle `client`).
endpoints:
  -
    custom: []
    httpMethods:
      - GET
    uri: api/v1/prestataires
    metadata:
      custom: []
      groupName: 'Client — recherche de prestataires'
      groupDescription: |-

        Routes réservées aux clients (jeton Sanctum + rôle `client`).
      subgroup: ''
      subgroupDescription: ''
      title: 'Rechercher des prestataires'
      description: |-
        Paginée (20 par page). Ne renvoie que les prestataires dont le compte est actif et qui ont au moins une prestation active.
        Tous les filtres sont optionnels et combinables. Aucune donnée personnelle n'est renvoyée, et pas de note (les avis n'existent pas encore).
        La recherche ignore la casse mais pas les accents. `prixMin` et `nombrePrestations` portent sur toutes les prestations actives du prestataire.
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {VOTRE_JETON}'
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters:
      metier:
        custom: []
        name: metier
        description: 'Métier : mecanique, coiffure ou pressing.'
        required: false
        example: mecanique
        type: string
        enumValues:
          - mecanique
          - coiffure
          - pressing
        exampleWasSpecified: false
        nullable: true
        deprecated: false
      quartier:
        custom: []
        name: quartier
        description: 'Quartier (égalité exacte, sans tenir compte de la casse ni des espaces superflus). Le champ value ne doit pas dépasser 100 caractères.'
        required: false
        example: Malika
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: true
        deprecated: false
      q:
        custom: []
        name: q
        description: "Texte contenu dans le nom de l'entreprise ou dans le nom d'une prestation active (sans tenir compte de la casse ; les accents comptent). Le champ value ne doit pas dépasser 100 caractères."
        required: false
        example: vidange
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: true
        deprecated: false
      prix_min:
        custom: []
        name: prix_min
        description: 'Le prestataire a une prestation active à ce prix ou plus (FCFA). Le champ value doit être au moins égal à 0. Le champ value ne doit pas dépasser 9999999999.99.'
        required: false
        example: 5000.0
        type: number
        enumValues: []
        exampleWasSpecified: false
        nullable: true
        deprecated: false
      prix_max:
        custom: []
        name: prix_max
        description: 'Le prestataire a une prestation active à ce prix ou moins (FCFA), et ≥ prix_min. Le champ value doit être au moins égal à 0. Le champ value ne doit pas dépasser 9999999999.99.'
        required: false
        example: 20000.0
        type: number
        enumValues: []
        exampleWasSpecified: false
        nullable: true
        deprecated: false
      tri:
        custom: []
        name: tri
        description: 'nom (défaut), prix_asc ou prix_desc (selon le prix minimal des prestations actives).'
        required: false
        example: prix_asc
        type: string
        enumValues:
          - nom
          - prix_asc
          - prix_desc
        exampleWasSpecified: false
        nullable: true
        deprecated: false
      page:
        custom: []
        name: page
        description: 'Numéro de page (20 résultats par page). Le champ value doit être au moins égal à 1.'
        required: false
        example: 1
        type: integer
        enumValues: []
        exampleWasSpecified: false
        nullable: true
        deprecated: false
    cleanQueryParameters:
      metier: mecanique
      quartier: Malika
      q: vidange
      prix_min: 5000.0
      prix_max: 20000.0
      tri: prix_asc
      page: 1
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: '{"data":[{"id":"0198a1b2-0000-7000-8000-000000000002","nomEntreprise":"Garage Moussa","metier":"mecanique","quartier":"Malika","adresse":"Rue 10, près du marché","prixMin":5000,"nombrePrestations":3}],"links":{"first":"https://api.exemple.test/api/v1/prestataires?page=1","last":"https://api.exemple.test/api/v1/prestataires?page=1","prev":null,"next":null},"meta":{"current_page":1,"last_page":1,"per_page":20,"total":1}}'
        headers: []
        description: ''
      -
        custom: []
        status: 401
        content: '{"message":"Authentification requise."}'
        headers: []
        description: ''
      -
        custom: []
        status: 403
        content: '{"message":"Vous n''avez pas le droit d''effectuer cette action."}'
        headers: []
        description: ''
      -
        custom: []
        status: 422
        content: '{"message":"Le prix maximum doit être supérieur ou égal au prix minimum.","errors":{"prix_max":["Le prix maximum doit être supérieur ou égal au prix minimum."]}}'
        headers: []
        description: ''
    responseFields: []
    auth:
      - headers
      - Authorization
      - 'Bearer JETON_FICTIF'
    controller: null
    method: null
    route: null
