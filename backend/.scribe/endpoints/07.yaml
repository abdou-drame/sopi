name: 'Administration — réservations'
description: |-

  Routes de lecture réservées aux administrateurs (jeton Sanctum + rôle `administrateur`). Le code de réservation n'est jamais renvoyé.
endpoints:
  -
    custom: []
    httpMethods:
      - GET
    uri: api/v1/admin/reservations
    metadata:
      custom: []
      groupName: 'Administration — réservations'
      groupDescription: |-

        Routes de lecture réservées aux administrateurs (jeton Sanctum + rôle `administrateur`). Le code de réservation n'est jamais renvoyé.
      subgroup: ''
      subgroupDescription: ''
      title: 'Liste des réservations'
      description: |-
        Toutes les réservations, de la plus récente à la plus ancienne (20 par page). Filtres combinables : `statut`, `prestataire`
        (identifiant du profil prestataire), `client` (identifiant du compte), `debut` / `fin` (jour de début du créneau) et `q`
        (code de réservation, recherche partielle). Le client n'apparaît que par son prénom et l'initiale de son nom ;
        `statutPaiement` est celui du paiement qui représente la réservation (`null` sans paiement).
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {VOTRE_JETON}'
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters:
      statut:
        custom: []
        name: statut
        description: 'en_attente, acceptee, confirmee, en_cours, terminee, refusee ou annulee.'
        required: false
        example: confirmee
        type: string
        enumValues:
          - en_attente
          - acceptee
          - confirmee
          - en_cours
          - terminee
          - refusee
          - annulee
        exampleWasSpecified: false
        nullable: true
        deprecated: false
      prestataire:
        custom: []
        name: prestataire
        description: "Identifiant du profil prestataire (celui des autres routes d'administration). validation.uuid."
        required: false
        example: 0198a1b2-0000-7000-8000-000000000012
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: true
        deprecated: false
      client:
        custom: []
        name: client
        description: 'Identifiant du compte client. validation.uuid.'
        required: false
        example: 0198a1b2-0000-7000-8000-000000000001
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: true
        deprecated: false
      q:
        custom: []
        name: q
        description: "Code de réservation (recherche partielle, sans tenir compte de la casse). Le code lui-même n'est jamais renvoyé. Le champ value ne doit pas dépasser 20 caractères."
        required: false
        example: AB12
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: true
        deprecated: false
      page:
        custom: []
        name: page
        description: 'Numéro de page (20 résultats par page). Le champ value doit être au moins égal à 1.'
        required: false
        example: 1
        type: integer
        enumValues: []
        exampleWasSpecified: false
        nullable: true
        deprecated: false
      debut:
        custom: []
        name: debut
        description: 'Créneaux commençant à partir de ce jour (AAAA-MM-JJ, inclus). Must be a valid date in the format <code>Y-m-d</code>.'
        required: false
        example: '2030-01-01'
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: true
        deprecated: false
      fin:
        custom: []
        name: fin
        description: "Créneaux commençant jusqu'à ce jour (AAAA-MM-JJ, inclus). Must be a valid date in the format <code>Y-m-d</code>."
        required: false
        example: '2030-01-31'
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: true
        deprecated: false
    cleanQueryParameters:
      statut: confirmee
      prestataire: 0198a1b2-0000-7000-8000-000000000012
      client: 0198a1b2-0000-7000-8000-000000000001
      q: AB12
      page: 1
      debut: '2030-01-01'
      fin: '2030-01-31'
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
