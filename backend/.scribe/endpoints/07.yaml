        headers: []
        description: ''
      -
        custom: []
        status: 401
        content: '{"message":"Authentification requise."}'
        headers: []
        description: ''
      -
        custom: []
        status: 403
        content: '{"message":"Vous n''avez pas le droit d''effectuer cette action."}'
        headers: []
        description: ''
      -
        custom: []
        status: 422
        content: '{"message":"Le prestataire doit être un identifiant valide.","errors":{"prestataire":["Le prestataire doit être un identifiant valide."]}}'
        headers: []
        description: ''
    responseFields: []
    auth:
      - headers
      - Authorization
      - 'Bearer JETON_FICTIF'
    controller: null
    method: null
    route: null
