name: 'Client — paiement'
description: |-

  Routes réservées aux clients (jeton Sanctum + rôle `client`), limitées à 10 requêtes par minute et par utilisateur.
endpoints:
  -
    custom: []
    httpMethods:
      - POST
    uri: 'api/v1/reservations/{id}/payer'
    metadata:
      custom: []
      groupName: 'Client — paiement'
      groupDescription: |-

        Routes réservées aux clients (jeton Sanctum + rôle `client`), limitées à 10 requêtes par minute et par utilisateur.
      subgroup: ''
      subgroupDescription: ''
      title: "Payer l'acompte d'une réservation"
      description: |-
        Pour une réservation `acceptee` dont le délai de paiement (2 h après l'acceptation) n'est pas dépassé, crée le paiement de
        l'acompte (30 % du prix) et renvoie l'adresse de la page de paiement. Aucun corps : le montant est toujours calculé par le
        serveur à partir du prix courant de la prestation. La réservation reste `acceptee` : elle ne sera confirmée (et son code
        généré) qu'à la confirmation du paiement par le prestataire de paiement. Idempotent : si un paiement est déjà en cours
        pour cette réservation, le même paiement et la même adresse sont renvoyés avec le code 200.
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {VOTRE_JETON}'
      Content-Type: application/json
      Accept: application/json
    urlParameters:
      id:
        custom: []
        name: id
        description: 'Identifiant de la réservation.'
        required: true
        example: 0198a1b2-0000-7000-8000-000000000060
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanUrlParameters:
      id: 0198a1b2-0000-7000-8000-000000000060
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: '{"paiement":{"id":"0198a1b2-0000-7000-8000-000000000070","statut":"en_attente","montantAcompte":"4500.00","devise":"XOF"},"montantRestantSurPlace":"10500.00","urlPaiement":"https://paiement.exemple.test/session/abc123","reservation":{"id":"0198a1b2-0000-7000-8000-000000000060","statut":"acceptee"}}'
        headers: []
        description: ''
      -
        custom: []
        status: 201
        content: '{"paiement":{"id":"0198a1b2-0000-7000-8000-000000000070","statut":"en_attente","montantAcompte":"4500.00","devise":"XOF"},"montantRestantSurPlace":"10500.00","urlPaiement":"https://paiement.exemple.test/session/abc123","reservation":{"id":"0198a1b2-0000-7000-8000-000000000060","statut":"acceptee"}}'
        headers: []
        description: ''
      -
        custom: []
        status: 401
        content: '{"message":"Authentification requise."}'
        headers: []
        description: ''
      -
        custom: []
        status: 403
        content: '{"message":"Vous n''avez pas le droit d''effectuer cette action."}'
        headers: []
        description: ''
      -
        custom: []
        status: 404
        content: '{"message":"Réservation introuvable."}'
        headers: []
        description: ''
      -
        custom: []
        status: 409
        content: '{"message":"Le délai de paiement est dépassé."}'
        headers: []
        description: ''
      -
        custom: []
        status: 429
        content: '{"message":"Trop de tentatives. Réessayez dans quelques instants."}'
        headers: []
        description: ''
      -
        custom: []
        status: 503
        content: '{"message":"Le service de paiement est momentanément indisponible. Veuillez réessayer."}'
        headers: []
        description: ''
    responseFields: []
    auth:
      - headers
      - Authorization
      - 'Bearer JETON_FICTIF'
    controller: null
    method: null
    route: null
