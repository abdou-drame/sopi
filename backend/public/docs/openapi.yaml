openapi: 3.0.3
info:
  title: 'Sopi API'
  description: 'API REST de Sopi (réservation de services de proximité à Keur Massar). Préfixe /api/v1, JSON uniquement, erreurs en français : { "message": "...", "errors": { "champ": ["..."] } }.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: "Administration — demandes d'inscription"
    description: "\nRoutes réservées aux administrateurs (jeton Sanctum + rôle `administrateur`)."
  -
    name: 'Administration — litiges'
    description: "\nRoutes réservées aux administrateurs (jeton Sanctum + rôle `administrateur`). La décision est motivée et définitive ;\nelle ne déclenche aucun mouvement d'argent automatique."
  -
    name: 'Administration — modération des avis'
    description: "\nRoutes réservées aux administrateurs (jeton Sanctum + rôle `administrateur`). Masquer un avis (« supprimer ») le retire de la note\nmoyenne, des listes d'avis, de la recherche et du profil public ; la ligne est conservée et son auteur continue de la voir, avec\nl'indicateur `affichePubliquement: false`. Chaque décision est tracée (administrateur, date, motif). Les modifications sont limitées\nà 10 requêtes par minute."
  -
    name: 'Administration — sanctions'
    description: "\nRoutes réservées aux administrateurs (jeton Sanctum + rôle `administrateur`). Poser et lever une sanction sont limités à 10 requêtes par minute.\nUne suspension ou un bannissement est « tout ou rien » : sanction, statut du compte et révocation de tous ses jetons dans une seule\ntransaction. Le compte ne peut plus se connecter (le message de refus indique le motif et, pour une suspension, la date de fin),\ndisparaît de la recherche et du profil public, et ses réservations à venir (en attente, acceptées, confirmées pour un prestataire ;\nen attente et acceptées pour un client) sont annulées, un prestataire sanctionné voyant l'acompte versé remboursé en intégralité.\nUne prestation en cours va à son terme. Le solde et les retraits ne sont pas modifiés. Un administrateur ne peut pas être sanctionné."
  -
    name: "Client — agenda d'un prestataire"
    description: "\nRoutes réservées aux clients (jeton Sanctum + rôle `client`). Seuls les prestataires dont le compte est actif sont visibles."
  -
    name: 'Client — avis'
    description: "\nRoutes réservées aux clients (jeton Sanctum + rôle `client`), limitées à 10 requêtes par minute et par utilisateur."
  -
    name: "Client — avis d'un prestataire"
    description: "\nRoutes réservées aux clients (jeton Sanctum + rôle `client`). Seuls les prestataires dont le compte est actif sont consultables."
  -
    name: 'Client — litiges'
    description: "\nRoutes réservées aux clients (jeton Sanctum + rôle `client`). Un client ne voit que ses propres litiges. L'ouverture est limitée à 5 requêtes par minute et par utilisateur."
  -
    name: 'Client — paiement'
    description: "\nRoutes réservées aux clients (jeton Sanctum + rôle `client`), limitées à 10 requêtes par minute et par utilisateur."
  -
    name: "Client — profil public d'un prestataire"
    description: "\nRoutes réservées aux clients (jeton Sanctum + rôle `client`). Seuls les prestataires dont le compte est actif sont visibles."
  -
    name: 'Client — recherche de prestataires'
    description: "\nRoutes réservées aux clients (jeton Sanctum + rôle `client`)."
  -
    name: 'Client — réservations'
    description: "\nRoutes réservées aux clients (jeton Sanctum + rôle `client`). La création est limitée à 20 requêtes par minute et par utilisateur, l'annulation à 30."
  -
    name: "Client — verrou d'un créneau"
    description: "\nRoutes réservées aux clients (jeton Sanctum + rôle `client`), limitées à 20 requêtes par minute et par utilisateur.\nUn client sélectionne un créneau libre : il est verrouillé pour lui pendant 5 minutes, le temps de réserver."
  -
    name: Endpoints
    description: ''
  -
    name: Prestataires
    description: ''
  -
    name: 'Prestataire — agenda'
    description: "\nRoutes réservées aux prestataires (jeton Sanctum + rôle `prestataire`). L'agenda est fait de créneaux ;\nles dates et heures sont celles du fuseau Africa/Dakar. Un prestataire ne voit et ne modifie que son propre agenda."
  -
    name: 'Prestataire — catalogue de prestations'
    description: "\nRoutes réservées aux prestataires (jeton Sanctum + rôle `prestataire`). Le domaine d'une prestation est\ntoujours le métier du prestataire : il n'est jamais saisi. Une prestation ne se supprime pas, elle se désactive."
  -
    name: 'Prestataire — demandes de réservation'
    description: "\nRoutes réservées aux prestataires (jeton Sanctum + rôle `prestataire`). Un prestataire ne voit que les réservations\nde ses propres créneaux ; celles d'un autre répondent 404, comme une réservation inexistante. Le client n'est identifié\nque par son prénom et l'initiale de son nom."
  -
    name: 'Prestataire — litiges'
    description: "\nRoutes réservées aux prestataires (jeton Sanctum + rôle `prestataire`). Un prestataire ne voit que les litiges qui le visent ;\nle client n'y est identifié que par son prénom et l'initiale de son nom."
  -
    name: 'Prestataire — mes avis'
    description: "\nRoutes réservées aux prestataires (jeton Sanctum + rôle `prestataire`). Un prestataire ne voit que les avis qui le concernent."
  -
    name: "Prestataire — photos d'atelier"
    description: "\nRoutes réservées aux prestataires (jeton Sanctum + rôle `prestataire`). 6 photos au plus, stockées sur un disque privé.\nLes clients voient ces photos sur le profil public du prestataire."
  -
    name: 'Prestataire — solde et retraits'
    description: "\nRoutes réservées aux prestataires (jeton Sanctum + rôle `prestataire`). Un prestataire ne voit que son propre solde et ses\npropres retraits ; le retrait d'un autre prestataire répond 404, comme un retrait inexistant. Les montants sont en FCFA."
  -
    name: Profil
    description: "\nProfil de l'utilisateur connecté (client, prestataire ou administrateur)."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Le jeton est renvoyé par <code>POST /api/v1/auth/connexion</code> ou <code>/auth/inscription</code>.'
security:
  -
    default: []
paths:
  /api/v1/admin/prestataires/demandes:
    get:
      summary: 'Liste des demandes des prestataires'
      operationId: listeDesDemandesDesPrestataires
      description: 'Paginée (20 par page). Par défaut les demandes `en_attente`, de la plus ancienne à la plus récente.'
      parameters:
        -
          in: query
          name: statut
          description: 'en_attente (défaut), actif, refuse ou tous.'
          example: en_attente
          required: false
          schema:
            type: string
            description: 'en_attente (défaut), actif, refuse ou tous.'
            example: en_attente
            enum:
              - en_attente
              - actif
              - refuse
              - tous
            nullable: true
        -
          in: query
          name: page
          description: 'Numéro de page (20 résultats par page). Le champ value doit être au moins égal à 1.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Numéro de page (20 résultats par page). Le champ value doit être au moins égal à 1.'
            example: 1
            nullable: true
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 0198a1b2-0000-7000-8000-000000000002
                      nom: Diop
                      prenom: Moussa
                      nomEntreprise: 'Garage Moussa'
                      metier: mecanique
                      quartier: Malika
                      statutCompte: en_attente
                      dateSoumission: '2026-10-12T09:30:00+00:00'
                      nombreJustificatifs: 2
                  links:
