  /api/v1/auth/connexion:
    post:
      summary: Connexion
      operationId: connexion
      description: "Authentifie un compte actif. Un compte non actif reçoit 403 avec `message` et, quand elles existent, des informations\nstructurées : `motif` (sanction active, ou motif du refus d'inscription) et `finSuspension` (ISO 8601, suspension temporaire\nseulement). Le champ `statutCompte` (`en_attente`, `refuse`, `suspendu` ou `banni`) accompagne toujours ce 403. Les autres champs sont absents sinon."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  token: 1|abcdef
                  user:
                    id: 0198a1b2-0000-7000-8000-000000000001
                    role: client
                    statut: actif
                properties:
                  token:
                    type: string
                    example: 1|abcdef
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 0198a1b2-0000-7000-8000-000000000001
                      role:
                        type: string
                        example: client
                      statut:
                        type: string
                        example: actif
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Identifiant ou mot de passe incorrect.'
                properties:
                  message:
                    type: string
                    example: 'Identifiant ou mot de passe incorrect.'
        403:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: 'Compte suspendu'
                    type: object
                    example:
                      message: "Votre compte est suspendu jusqu'au 10/03/2030 à 14:30. Motif : Retards répétés."
                      statutCompte: suspendu
                      motif: 'Retards répétés.'
                      finSuspension: '2030-03-10T14:30:00+00:00'
                    properties:
                      message:
                        type: string
                        example: "Votre compte est suspendu jusqu'au 10/03/2030 à 14:30. Motif : Retards répétés."
                      statutCompte:
                        type: string
                        example: suspendu
                      motif:
                        type: string
                        example: 'Retards répétés.'
                      finSuspension:
                        type: string
                        example: '2030-03-10T14:30:00+00:00'
                  -
                    description: 'Inscription refusée'
                    type: object
                    example:
                      message: "Votre demande d'inscription a été refusée."
                      statutCompte: refuse
                      motif: 'Pièces illisibles.'
                    properties:
                      message:
                        type: string
                        example: "Votre demande d'inscription a été refusée."
                      statutCompte:
                        type: string
                        example: refuse
                      motif:
                        type: string
                        example: 'Pièces illisibles.'
                  -
                    description: 'En attente de validation'
                    type: object
                    example:
                      message: 'Votre compte est en attente de validation.'
                      statutCompte: en_attente
                    properties:
                      message:
                        type: string
                        example: 'Votre compte est en attente de validation.'
                      statutCompte:
                        type: string
                        example: en_attente
      tags:
        - Authentification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                identifiant:
                  type: string
                  description: 'Adresse e-mail ou numéro de téléphone mobile sénégalais. Le champ « telephone » reste accepté à la place. Le champ value ne doit pas dépasser 255 caractères.'
                  example: awa@example.com
                password:
                  type: string
                  description: 'Mot de passe du compte. Le champ value ne doit pas dépasser 255 caractères.'
                  example: MotDePasse123
              required:
                - identifiant
                - password
      security: []
