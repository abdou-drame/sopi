    post:
      summary: 'Trancher un litige'
      operationId: trancherUnLitige
      description: "Clôture un litige ouvert par une décision motivée (`rejet`, `avertissement`, `suspension_temporaire` ou `bannissement_definitif`). Une décision de sanction pose la sanction sur le `prestataire` (défaut) ou le `client` dans la même transaction que la clôture (voir « Administration — sanctions » pour ses effets). Un litige déjà clôturé répond 409, y compris\nsi deux décisions arrivent en même temps : une seule est retenue."
