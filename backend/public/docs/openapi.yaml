  /api/v1/admin/alertes:
    get:
      summary: Alertes
      operationId: alertes
      description: "Éléments qui demandent l'attention de l'administrateur, calculés à la demande (rien n'est envoyé : l'administrateur ne reçoit ni\ne-mail ni notification push). Liste vide quand tout est calme. Triées de la plus grave à la moins grave. Types : `dossiers_en_attente`,\n`litiges_ouverts`, `avis_signales`, `retraits_bloques`, `remboursements_en_echec`, `remboursements_en_retard`,\n`notifications_en_echec`, `suspensions_a_echeance`. Gravités : `info`, `attention`, `critique` (seuils configurables, `sopi.admin.alertes.*`).\n`ids` : au plus 20 identifiants, les plus anciens d'abord, pour ouvrir les éléments (le dossier est identifié par l'id du prestataire) ;\n`compteur` donne le total réel. `ressource` : où ouvrir les `ids` dans l'administration (`demandes-prestataires` : `/admin/prestataires/{id}`, `litiges`, `retraits`, `paiements`, `notifications` : `/admin/notifications-en-echec/{id}` ; `avis` : liste `/admin/avis?aTraiter=1` ; `sanctions` : liste `/admin/sanctions?echeanceDansHeures=24`). `ageMinutes` : ancienneté du plus ancien élément ; `echeanceDansMinutes` : délai avant la première fin de suspension."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  dateGeneration: '2030-01-20T10:00:00+00:00'
                  total: 2
                  parGravite:
                    critique: 1
                    attention: 0
                    info: 1
                  alertes:
                    -
                      type: litiges_ouverts
                      gravite: critique
                      compteur: 2
                      message: '2 litiges ouverts sont à traiter.'
                      ids:
                        - 0198a1b2-0000-7000-8000-000000000020
                        - 0198a1b2-0000-7000-8000-000000000021
                      ageMinutes: 4500
                      echeanceDansMinutes: null
                    -
                      type: suspensions_a_echeance
                      gravite: info
                      compteur: 1
                      message: '1 suspension temporaire se termine bientôt.'
                      ids:
                        - 0198a1b2-0000-7000-8000-000000000030
                      ageMinutes: null
                      echeanceDansMinutes: 600
                properties:
                  dateGeneration:
                    type: string
                    example: '2030-01-20T10:00:00+00:00'
                  total:
                    type: integer
                    example: 2
                  parGravite:
                    type: object
                    properties:
                      critique:
                        type: integer
                        example: 1
                      attention:
                        type: integer
                        example: 0
                      info:
                        type: integer
                        example: 1
                  alertes:
                    type: array
                    example:
                      -
                        type: litiges_ouverts
                        gravite: critique
                        compteur: 2
                        message: '2 litiges ouverts sont à traiter.'
                        ids:
                          - 0198a1b2-0000-7000-8000-000000000020
                          - 0198a1b2-0000-7000-8000-000000000021
                        ageMinutes: 4500
                        echeanceDansMinutes: null
                      -
                        type: suspensions_a_echeance
                        gravite: info
                        compteur: 1
                        message: '1 suspension temporaire se termine bientôt.'
                        ids:
                          - 0198a1b2-0000-7000-8000-000000000030
                        ageMinutes: null
                        echeanceDansMinutes: 600
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          example: litiges_ouverts
                        gravite:
                          type: string
                          example: critique
                        compteur:
                          type: integer
                          example: 2
                        message:
                          type: string
                          example: '2 litiges ouverts sont à traiter.'
                        ids:
                          type: array
                          example:
                            - 0198a1b2-0000-7000-8000-000000000020
                            - 0198a1b2-0000-7000-8000-000000000021
                          items:
                            type: string
                        ageMinutes:
                          type: integer
                          example: 4500
                        echeanceDansMinutes:
                          type: string
                          example: null
                          nullable: true
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Authentification requise.'
                properties:
                  message:
                    type: string
                    example: 'Authentification requise.'
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: "Vous n'avez pas le droit d'effectuer cette action."
                properties:
                  message:
                    type: string
                    example: "Vous n'avez pas le droit d'effectuer cette action."
