          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Authentification requise.'
                properties:
                  message:
                    type: string
                    example: 'Authentification requise.'
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: "Vous n'avez pas le droit d'effectuer cette action."
                properties:
                  message:
                    type: string
                    example: "Vous n'avez pas le droit d'effectuer cette action."
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Solde insuffisant.'
                  errors:
                    montant:
                      - 'Solde insuffisant.'
                properties:
                  message:
                    type: string
                    example: 'Solde insuffisant.'
                  errors:
                    type: object
                    properties:
                      montant:
                        type: array
                        example:
                          - 'Solde insuffisant.'
                        items:
                          type: string
        429:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Trop de tentatives. Réessayez dans quelques instants.'
                properties:
                  message:
                    type: string
                    example: 'Trop de tentatives. Réessayez dans quelques instants.'
        503:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: "Le versement n'a pas pu être effectué. Votre solde n'a pas été débité. Veuillez réessayer."
                properties:
                  message:
                    type: string
                    example: "Le versement n'a pas pu être effectué. Votre solde n'a pas été débité. Veuillez réessayer."
      tags:
        - 'Prestataire — solde et retraits'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                montant:
                  type: integer
                  description: 'Montant à retirer, en FCFA (entier), entre le minimum et le maximum de la configuration. Le champ value doit être au moins égal à 1000. Le champ value ne doit pas dépasser 500000.'
