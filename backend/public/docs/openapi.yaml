  '/api/v1/prestataires/{id}/agenda':
    get:
      summary: "Créneaux disponibles d'un prestataire"
      operationId: crneauxDisponiblesDunPrestataire
      description: "Uniquement les créneaux réservables : libres (ou dont le verrou a expiré) et qui commencent dans le futur.\nLes créneaux réservés, indisponibles ou verrouillés par un autre client n'apparaissent pas. Triés par début, sans pagination.\nPar défaut : de maintenant à 14 jours plus tard. Intervalle maximal : 31 jours. Réponse jamais mise en cache (`Cache-Control: no-store`)."
      parameters:
        -
          in: query
          name: du
          description: "Premier jour (AAAA-MM-JJ), aujourd'hui ou plus tard. Par défaut : maintenant. Must be a valid date in the format <code>Y-m-d</code>."
          example: '2030-01-15'
          required: false
          schema:
            type: string
            description: "Premier jour (AAAA-MM-JJ), aujourd'hui ou plus tard. Par défaut : maintenant. Must be a valid date in the format <code>Y-m-d</code>."
            example: '2030-01-15'
            nullable: true
        -
          in: query
          name: au
          description: 'Dernier jour inclus (AAAA-MM-JJ). Par défaut : 14 jours après le début. Intervalle maximal : 31 jours. Must be a valid date in the format <code>Y-m-d</code>.'
          example: '2030-01-29'
          required: false
          schema:
            type: string
            description: 'Dernier jour inclus (AAAA-MM-JJ). Par défaut : 14 jours après le début. Intervalle maximal : 31 jours. Must be a valid date in the format <code>Y-m-d</code>.'
            example: '2030-01-29'
            nullable: true
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 0198a1b2-0000-7000-8000-000000000040
                      dateDebut: '2030-01-15T09:00:00+00:00'
                      dateFin: '2030-01-15T10:00:00+00:00'
                properties:
                  data:
                    type: array
                    example:
                      -
                        id: 0198a1b2-0000-7000-8000-000000000040
                        dateDebut: '2030-01-15T09:00:00+00:00'
                        dateFin: '2030-01-15T10:00:00+00:00'
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: 0198a1b2-0000-7000-8000-000000000040
                        dateDebut:
                          type: string
                          example: '2030-01-15T09:00:00+00:00'
                        dateFin:
                          type: string
                          example: '2030-01-15T10:00:00+00:00'
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Authentification requise.'
                properties:
                  message:
                    type: string
                    example: 'Authentification requise.'
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: "Vous n'avez pas le droit d'effectuer cette action."
                properties:
                  message:
                    type: string
                    example: "Vous n'avez pas le droit d'effectuer cette action."
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Prestataire introuvable.'
                properties:
                  message:
                    type: string
                    example: 'Prestataire introuvable.'
        422:
          description: ''
          content:
            application/json:
              schema:
