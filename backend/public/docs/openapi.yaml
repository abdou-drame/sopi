      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  id: 0198a1b2-0000-7000-8000-000000000090
                  statut: cloture
                  decision: rejet
                  motifDecision: 'Signalement non fondé.'
                  clotureLe: '2030-01-17T09:00:00+00:00'
                properties:
                  id:
                    type: string
                    example: 0198a1b2-0000-7000-8000-000000000090
                  statut:
                    type: string
                    example: cloture
                  decision:
                    type: string
                    example: rejet
                  motifDecision:
                    type: string
                    example: 'Signalement non fondé.'
                  clotureLe:
                    type: string
                    example: '2030-01-17T09:00:00+00:00'
