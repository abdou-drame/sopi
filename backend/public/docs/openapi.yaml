                  dateTraitement: '2030-01-15T08:50:02+00:00'
                properties:
                  id:
                    type: string
                    example: 0198a1b2-0000-7000-8000-000000000070
                  montant:
                    type: number
                    example: 5000.0
                  statut:
                    type: string
                    example: reussi
                  telephoneVersement:
                    type: string
                    example: '+221******567'
                  dateDemande:
                    type: string
                    example: '2030-01-15T08:50:00+00:00'
                  dateTraitement:
                    type: string
                    example: '2030-01-15T08:50:02+00:00'
