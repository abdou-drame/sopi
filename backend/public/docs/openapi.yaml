                          example: 0198a1b2-0000-7000-8000-000000000002
                        nom:
                          type: string
                          example: Diop
                        prenom:
                          type: string
                          example: Moussa
                        nomEntreprise:
                          type: string
                          example: 'Garage Moussa'
                        metier:
                          type: string
                          example: mecanique
                        quartier:
                          type: string
                          example: Malika
                        statutCompte:
                          type: string
                          example: en_attente
                        dateSoumission:
                          type: string
                          example: '2026-10-12T09:30:00+00:00'
                        nombreJustificatifs:
                          type: integer
                          example: 2
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                        example: 'https://api.exemple.test/api/v1/admin/prestataires/demandes?page=1'
                      last:
                        type: string
                        example: 'https://api.exemple.test/api/v1/admin/prestataires/demandes?page=1'
                      prev:
                        type: string
