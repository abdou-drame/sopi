                  metier:
                    type: string
                    example: mecanique
                  statutCompte:
                    type: string
                    example: en_attente
                  motifRefus:
                    type: string
                    example: null
                    nullable: true
                  dateSoumission:
                    type: string
                    example: '2026-10-12T09:30:00+00:00'
                  justificatifs:
                    type: array
                    example:
                      -
                        typeDocument: cni
                        statut: en_attente
                      -
                        typeDocument: diplome
                        statut: en_attente
                    items:
                      type: object
                      properties:
                        typeDocument:
                          type: string
                          example: cni
                        statut:
                          type: string
                          example: en_attente
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Lien de suivi invalide ou expiré.'
                properties:
                  message:
                    type: string
                    example: 'Lien de suivi invalide ou expiré.'
        429:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Trop de tentatives. Réessayez dans quelques instants.'
                properties:
                  message:
                    type: string
                    example: 'Trop de tentatives. Réessayez dans quelques instants.'
      tags:
        - Prestataires
      security: []
    parameters:
      -
        in: path
        name: jeton
        description: "Jeton de suivi reçu à l'inscription."
        example: jeton-de-suivi-exemple-0123456789-abcdefghijklmnop
        required: true
        schema:
          type: string
