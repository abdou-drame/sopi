  /api/v1/admin/revenus:
    get:
      summary: 'Revenus de la plateforme'
      operationId: revenusDeLaPlateforme
      description: "Série par jour, semaine (lundi à dimanche) ou mois calendaire, sur une période de 366 jours au plus (bornes incluses, fuseau\nAfrica/Dakar). Par défaut : les 30 derniers jours, par jour. Les périodes vides sont présentes avec des zéros.\nDéfinitions : **revenus** = commissions des paiements réussis dont le crédit au prestataire est fait (prestation terminée ou annulation par le client d'une réservation payée), datées\npar ce crédit, paiements remboursés exclus ; **acomptesEncaisses** = acomptes des paiements réussis, datés par le paiement ;\n**remboursements** = acomptes remboursés, datés par le remboursement ; **retraitsVerses** = retraits réussis, datés par leur traitement.\n**soldePrestataires** est le cumul des soldes à l'instant de la demande. Montants en FCFA entiers."
      parameters:
        -
          in: query
          name: debut
          description: 'Premier jour de la période (AAAA-MM-JJ, inclus). Par défaut : 29 jours avant la fin. Must be a valid date in the format <code>Y-m-d</code>.'
          example: '2030-01-01'
          required: false
          schema:
            type: string
            description: 'Premier jour de la période (AAAA-MM-JJ, inclus). Par défaut : 29 jours avant la fin. Must be a valid date in the format <code>Y-m-d</code>.'
            example: '2030-01-01'
            nullable: true
        -
          in: query
          name: fin
          description: "Dernier jour de la période (AAAA-MM-JJ, inclus). Par défaut : aujourd'hui. Au plus 366 jours après le début. Must be a valid date in the format <code>Y-m-d</code>."
          example: '2030-01-31'
          required: false
          schema:
            type: string
            description: "Dernier jour de la période (AAAA-MM-JJ, inclus). Par défaut : aujourd'hui. Au plus 366 jours après le début. Must be a valid date in the format <code>Y-m-d</code>."
            example: '2030-01-31'
            nullable: true
        -
          in: query
          name: regroupement
          description: 'Pas de la série : `jour` (défaut), `semaine` (lundi à dimanche) ou `mois` (mois calendaire).'
          example: semaine
          required: false
          schema:
            type: string
            description: 'Pas de la série : `jour` (défaut), `semaine` (lundi à dimanche) ou `mois` (mois calendaire).'
            example: semaine
            enum:
              - jour
              - semaine
              - mois
            nullable: true
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  dateGeneration: '2030-01-20T10:00:00+00:00'
                  periode:
                    debut: '2030-01-01'
                    fin: '2030-01-10'
                    regroupement: semaine
                    fuseau: Africa/Dakar
                  totaux:
                    revenus: 42000
                    acomptesEncaisses: 150000
                    remboursements: 9000
                    retraitsVerses: 60000
                  soldePrestataires: 84000
                  series:
                    -
                      debut: '2030-01-01'
                      fin: '2030-01-06'
                      revenus: 30000
                      acomptesEncaisses: 90000
                      remboursements: 0
                      retraitsVerses: 60000
                    -
                      debut: '2030-01-07'
                      fin: '2030-01-10'
                      revenus: 12000
                      acomptesEncaisses: 60000
                      remboursements: 9000
                      retraitsVerses: 0
                properties:
                  dateGeneration:
                    type: string
                    example: '2030-01-20T10:00:00+00:00'
                  periode:
                    type: object
                    properties:
                      debut:
                        type: string
                        example: '2030-01-01'
                      fin:
                        type: string
                        example: '2030-01-10'
                      regroupement:
                        type: string
                        example: semaine
                      fuseau:
                        type: string
                        example: Africa/Dakar
                  totaux:
                    type: object
                    properties:
                      revenus:
                        type: integer
                        example: 42000
                      acomptesEncaisses:
                        type: integer
                        example: 150000
                      remboursements:
                        type: integer
                        example: 9000
                      retraitsVerses:
                        type: integer
                        example: 60000
                  soldePrestataires:
                    type: integer
                    example: 84000
                  series:
                    type: array
                    example:
                      -
                        debut: '2030-01-01'
                        fin: '2030-01-06'
                        revenus: 30000
                        acomptesEncaisses: 90000
                        remboursements: 0
                        retraitsVerses: 60000
                      -
                        debut: '2030-01-07'
                        fin: '2030-01-10'
                        revenus: 12000
                        acomptesEncaisses: 60000
                        remboursements: 9000
                        retraitsVerses: 0
                    items:
                      type: object
                      properties:
                        debut:
                          type: string
                          example: '2030-01-01'
                        fin:
                          type: string
                          example: '2030-01-06'
                        revenus:
                          type: integer
                          example: 30000
                        acomptesEncaisses:
                          type: integer
                          example: 90000
                        remboursements:
                          type: integer
                          example: 0
                        retraitsVerses:
                          type: integer
                          example: 60000
