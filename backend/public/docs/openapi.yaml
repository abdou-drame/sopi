          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: "Vous n'avez pas le droit d'effectuer cette action."
                properties:
                  message:
                    type: string
                    example: "Vous n'avez pas le droit d'effectuer cette action."
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Litige introuvable.'
                properties:
                  message:
                    type: string
                    example: 'Litige introuvable.'
        409:
