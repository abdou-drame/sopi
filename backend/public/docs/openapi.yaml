                          example: Moussa
                        nomEntreprise:
                          type: string
                          example: 'Garage Moussa'
                        metier:
                          type: string
                          example: mecanique
                        quartier:
                          type: string
                          example: Malika
                        statutCompte:
                          type: string
                          example: en_attente
                        dateSoumission:
                          type: string
                          example: '2026-10-12T09:30:00+00:00'
                        nombreJustificatifs:
                          type: integer
                          example: 2
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                        example: 'https://api.exemple.test/api/v1/admin/prestataires/demandes?page=1'
                      last:
                        type: string
                        example: 'https://api.exemple.test/api/v1/admin/prestataires/demandes?page=1'
                      prev:
                        type: string
                        example: null
                        nullable: true
                      next:
                        type: string
                        example: null
                        nullable: true
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      last_page:
                        type: integer
                        example: 1
                      per_page:
                        type: integer
                        example: 20
                      total:
                        type: integer
                        example: 1
        401:
          description: ''
          content:
            application/json:
