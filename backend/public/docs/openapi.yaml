        - "Administration — demandes d'inscription"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                motif:
                  type: string
                  description: 'Raison du refus, communiquée au prestataire (10 à 500 caractères). Le champ value doit contenir au moins 10 caractères. Le champ value ne doit pas dépasser 500 caractères.'
                  example: 'La photocopie de la CNI est illisible.'
              required:
                - motif
    parameters:
      -
        in: path
        name: id
        description: 'Identifiant du prestataire.'
        example: 0198a1b2-0000-7000-8000-000000000002
        required: true
        schema:
          type: string
  '/api/v1/admin/justificatifs/{id}/telecharger':
    get:
      summary: 'Télécharger un justificatif'
      operationId: tlchargerUnJustificatif
      description: 'Renvoie le fichier en flux depuis le stockage privé (affichage direct pour les PDF et images).'
      parameters: []
      responses:
        200:
          description: Fichier
          content:
            text/plain:
              schema:
                type: string
                example: 'Contenu binaire du fichier (Content-Type: application/pdf, image/jpeg ou image/png)'
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Justificatif introuvable.'
                properties:
                  message:
                    type: string
                    example: 'Justificatif introuvable.'
      tags:
        - "Administration — demandes d'inscription"
    parameters:
      -
        in: path
        name: id
        description: 'Identifiant du justificatif.'
        example: 0198a1b2-0000-7000-8000-000000000010
        required: true
        schema:
          type: string
  /api/v1/health:
    get:
      summary: ''
      operationId: getApiV1Health
      description: ''
      parameters: []
      responses:
        503:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: ok
                  app: Sopi
                  version: 0.1.0
                  database: erreur
                  time: '2026-10-11T16:03:50+00:00'
                properties:
                  status:
                    type: string
                    example: ok
                  app:
                    type: string
                    example: Sopi
                  version:
                    type: string
                    example: 0.1.0
                  database:
                    type: string
                    example: erreur
                  time:
                    type: string
                    example: '2026-10-11T16:03:50+00:00'
      tags:
        - Endpoints
      security: []
  /api/v1/auth/inscription:
    post:
      summary: ''
      operationId: postApiV1AuthInscription
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nom:
                  type: string
                  description: 'Le champ value ne doit pas dépasser 100 caractères.'
                  example: vmqeopfuudtdsufvyvddq
                prenom:
                  type: string
                  description: 'Le champ value ne doit pas dépasser 100 caractères.'
                  example: amniihfqcoynlazghdtqt
                telephone:
                  type: string
                  description: 'Must match the regex /^\+2217[05678]\d{7}$/.'
                  example: '+221705627717'
                email:
                  type: string
                  description: 'Le champ value doit être une adresse e-mail valide. Le champ value ne doit pas dépasser 255 caractères.'
                  example: reichel.charity@example.net
                  nullable: true
                password:
                  type: string
                  description: 'Le champ value doit contenir au moins 8 caractères. Le champ value ne doit pas dépasser 255 caractères.'
                  example: 'o,+]"OP>@;4[*UyPJ"}6'
              required:
                - nom
                - prenom
                - telephone
                - password
      security: []
  /api/v1/auth/connexion:
    post:
      summary: ''
      operationId: postApiV1AuthConnexion
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                telephone:
                  type: string
                  description: 'Le champ value ne doit pas dépasser 30 caractères.'
                  example: vmqeopfuudtdsufvyvddq
                password:
                  type: string
                  description: 'Le champ value ne doit pas dépasser 255 caractères.'
                  example: OP>@;4
              required:
                - telephone
                - password
      security: []
  /api/v1/auth/deconnexion:
    post:
      summary: ''
      operationId: postApiV1AuthDeconnexion
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      security: []
  /api/v1/auth/moi:
    get:
      summary: ''
      operationId: getApiV1AuthMoi
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Authentification requise.'
                properties:
                  message:
                    type: string
                    example: 'Authentification requise.'
      tags:
        - Endpoints
      security: []
  /api/v1/prestataires/inscription:
    post:
      summary: "Inscription d'un prestataire"
      operationId: inscriptionDunPrestataire
      description: "Envoi en `multipart/form-data`. Crée le compte (statut `en_attente`, il ne peut pas se connecter avant validation\npar un administrateur), le profil et les justificatifs. Le dossier doit contenir au moins une CNI et un diplôme\nou une attestation (5 fichiers au maximum, PDF/JPG/PNG, 5 Mo chacun). Limité à 10 requêtes par heure et par adresse IP.\n\nLe `jeton_suivi` n'est renvoyé qu'une seule fois : seul son hachage est conservé. Les chemins des fichiers ne sont jamais renvoyés."
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  id: 0198a1b2-0000-7000-8000-000000000002
                  nom: Diop
                  prenom: Moussa
                  nomEntreprise: 'Garage Moussa'
                  metier: mecanique
                  statutCompte: en_attente
                  jeton_suivi: jeton-de-suivi-exemple-0123456789-abcdefghijklmnop
                  lien_suivi: 'https://api.exemple.test/api/v1/suivi/jeton-de-suivi-exemple-0123456789-abcdefghijklmnop'
                  justificatifs:
                    -
                      type: cni
                      statut: en_attente
                    -
                      type: diplome
                      statut: en_attente
                properties:
                  id:
                    type: string
                    example: 0198a1b2-0000-7000-8000-000000000002
                  nom:
                    type: string
                    example: Diop
                  prenom:
                    type: string
                    example: Moussa
                  nomEntreprise:
                    type: string
                    example: 'Garage Moussa'
                  metier:
                    type: string
                    example: mecanique
                  statutCompte:
                    type: string
                    example: en_attente
                  jeton_suivi:
                    type: string
                    example: jeton-de-suivi-exemple-0123456789-abcdefghijklmnop
                  lien_suivi:
                    type: string
                    example: 'https://api.exemple.test/api/v1/suivi/jeton-de-suivi-exemple-0123456789-abcdefghijklmnop'
                  justificatifs:
                    type: array
                    example:
                      -
                        type: cni
                        statut: en_attente
                      -
                        type: diplome
                        statut: en_attente
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          example: cni
                        statut:
                          type: string
                          example: en_attente
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Le dossier doit contenir une copie de votre CNI.'
                  errors:
                    justificatifs:
                      - 'Le dossier doit contenir une copie de votre CNI.'
                properties:
                  message:
                    type: string
                    example: 'Le dossier doit contenir une copie de votre CNI.'
                  errors:
                    type: object
                    properties:
                      justificatifs:
                        type: array
                        example:
                          - 'Le dossier doit contenir une copie de votre CNI.'
                        items:
                          type: string
        429:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Trop de tentatives. Réessayez dans quelques instants.'
                properties:
                  message:
                    type: string
                    example: 'Trop de tentatives. Réessayez dans quelques instants.'
      tags:
        - Prestataires
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                nom:
                  type: string
                  description: 'Nom. Le champ value ne doit pas dépasser 100 caractères.'
                  example: Diop
                prenom:
                  type: string
                  description: 'Prénom. Le champ value ne doit pas dépasser 100 caractères.'
                  example: Moussa
                telephone:
                  type: string
                  description: 'Mobile sénégalais (avec ou sans +221), unique. Must match the regex /^\+2217[05678]\d{7}$/.'
                  example: '77 123 45 67'
                email:
                  type: string
                  description: 'Adresse e-mail, unique. Le champ value doit être une adresse e-mail valide. Le champ value ne doit pas dépasser 255 caractères.'
                  example: moussa@example.com
                mot_de_passe:
                  type: string
                  description: '8 caractères minimum. Le champ value doit contenir au moins 8 caractères. Le champ value ne doit pas dépasser 255 caractères.'
                  example: mot-de-passe-exemple
                nom_entreprise:
                  type: string
                  description: "Nom de l'entreprise ou de l'atelier. Le champ value ne doit pas dépasser 150 caractères."
                  example: 'Garage Moussa'
                metier:
                  type: string
                  description: 'mecanique, coiffure ou pressing.'
                  example: mecanique
                  enum:
                    - mecanique
                    - coiffure
                    - pressing
                quartier:
                  type: string
                  description: 'Quartier de Keur Massar. Le champ value ne doit pas dépasser 100 caractères.'
                  example: Malika
                adresse:
                  type: string
                  description: 'Adresse. Le champ value ne doit pas dépasser 255 caractères.'
                  example: 'Rue 10, près du marché'
                justificatifs:
                  type: array
                  description: 'De 2 à 5 pièces : au moins une CNI et un diplôme ou une attestation. Le champ value doit contenir au moins 2 éléments. Le champ value ne doit pas contenir plus de 5 éléments.'
                  example:
                    - []
                  items:
                    type: object
                    properties:
                      type_document:
                        type: string
                        description: 'cni, diplome ou attestation.'
                        example: cni
                        enum:
                          - cni
                          - diplome
                          - attestation
                      fichier:
                        type: string
                        format: binary
                        description: 'PDF, JPG ou PNG, 5 Mo maximum. Must be a file. Le fichier ne doit pas dépasser 5120 Ko.'
                    required:
                      - type_document
                      - fichier
              required:
                - nom
                - prenom
                - telephone
                - email
                - mot_de_passe
                - nom_entreprise
                - metier
                - quartier
                - adresse
                - justificatifs
      security: []
  '/api/v1/suivi/{jeton}':
    get:
      summary: "Suivi du dossier d'inscription"
      operationId: suiviDuDossierDinscription
      description: "Route publique : le prestataire non encore actif suit son dossier avec le lien personnel reçu à l'inscription.\nNe renvoie aucune donnée personnelle. Le motif de refus n'est renseigné que si le dossier est refusé.\nUn jeton inconnu renvoie toujours la même réponse 404. Limité à 30 requêtes par minute et par adresse IP."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  nomEntreprise: 'Garage Moussa'
                  metier: mecanique
                  statutCompte: en_attente
                  motifRefus: null
                  dateSoumission: '2026-10-12T09:30:00+00:00'
                  justificatifs:
                    -
                      typeDocument: cni
                      statut: en_attente
                    -
                      typeDocument: diplome
                      statut: en_attente
                properties:
                  nomEntreprise:
                    type: string
                    example: 'Garage Moussa'
                  metier:
                    type: string
                    example: mecanique
                  statutCompte:
                    type: string
                    example: en_attente
                  motifRefus:
                    type: string
                    example: null
                    nullable: true
                  dateSoumission:
                    type: string
                    example: '2026-10-12T09:30:00+00:00'
                  justificatifs:
                    type: array
                    example:
                      -
                        typeDocument: cni
                        statut: en_attente
                      -
                        typeDocument: diplome
                        statut: en_attente
                    items:
                      type: object
                      properties:
                        typeDocument:
                          type: string
                          example: cni
                        statut:
                          type: string
                          example: en_attente
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Lien de suivi invalide ou expiré.'
                properties:
                  message:
                    type: string
                    example: 'Lien de suivi invalide ou expiré.'
        429:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Trop de tentatives. Réessayez dans quelques instants.'
                properties:
                  message:
                    type: string
                    example: 'Trop de tentatives. Réessayez dans quelques instants.'
      tags:
        - Prestataires
      security: []
    parameters:
      -
        in: path
        name: jeton
        description: "Jeton de suivi reçu à l'inscription."
        example: jeton-de-suivi-exemple-0123456789-abcdefghijklmnop
        required: true
        schema:
          type: string
