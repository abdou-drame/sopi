    get:
      summary: 'Mes réservations'
      operationId: mesRservations
      description: "Paginée (20 par page), de la plus récente à la plus ancienne. Filtres optionnels : `statut` et `groupe` (onglets `a_venir`, `terminees`, `annulees`, qui imposent leur propre ordre). Le `codeReservation` n'existe\nqu'après le paiement (`null` avant) et n'est jamais visible que de son client. `peutAnnuler` applique les règles `paiementAvant` (ISO 8601) est la date limite pour payer l'acompte (acceptation + délai de paiement), non nulle seulement pour une réservation acceptée non payée ; `reponseAvant` est la date limite de réponse du prestataire (création + délai de réponse), non nulle seulement pour une réservation en attente.\nde l'annulation."
      parameters:
        -
          in: query
          name: statut
          description: 'Filtre par statut : en_attente, acceptee, confirmee, en_cours, terminee, refusee, annulee. Par défaut : tous.'
          example: en_attente
          required: false
          schema:
            type: string
            description: 'Filtre par statut : en_attente, acceptee, confirmee, en_cours, terminee, refusee, annulee. Par défaut : tous.'
            example: en_attente
            enum:
              - en_attente
              - acceptee
              - confirmee
              - en_cours
              - terminee
              - refusee
              - annulee
            nullable: true
        -
          in: query
          name: groupe
          description: 'Onglet : a_venir (en attente, acceptée, confirmée ou en cours, créneau non terminé ; date de créneau croissante), terminees ou annulees (annulée ou refusée) ; les deux derniers du plus récent au plus ancien. Combinable avec statut.'
          example: a_venir
          required: false
          schema:
            type: string
            description: 'Onglet : a_venir (en attente, acceptée, confirmée ou en cours, créneau non terminé ; date de créneau croissante), terminees ou annulees (annulée ou refusée) ; les deux derniers du plus récent au plus ancien. Combinable avec statut.'
            example: a_venir
            enum:
              - a_venir
              - terminees
              - annulees
            nullable: true
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 0198a1b2-0000-7000-8000-000000000060
                      statut: en_attente
                      dateCreation: '2030-01-15T08:50:00+00:00'
                      motifRefus: null
                      codeReservation: null
