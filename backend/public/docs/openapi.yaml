openapi: 3.0.3
info:
  title: 'Sopi API'
  description: 'API REST de Sopi (réservation de services de proximité à Keur Massar). Préfixe /api/v1, JSON uniquement, erreurs en français : { "message": "...", "errors": { "champ": ["..."] } }.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: "Administration — demandes d'inscription"
    description: "\nRoutes réservées aux administrateurs (jeton Sanctum + rôle `administrateur`)."
  -
    name: Endpoints
    description: ''
  -
    name: Prestataires
    description: ''
  -
    name: Profil
    description: "\nProfil de l'utilisateur connecté (client, prestataire ou administrateur)."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Le jeton est renvoyé par <code>POST /api/v1/auth/connexion</code> ou <code>/auth/inscription</code>.'
security:
  -
    default: []
paths:
  /api/v1/admin/prestataires/demandes:
    get:
      summary: 'Liste des demandes des prestataires'
      operationId: listeDesDemandesDesPrestataires
      description: 'Paginée (20 par page). Par défaut les demandes `en_attente`, de la plus ancienne à la plus récente.'
      parameters:
        -
          in: query
          name: statut
          description: 'en_attente (défaut), actif, refuse ou tous.'
          example: en_attente
          required: false
          schema:
            type: string
            description: 'en_attente (défaut), actif, refuse ou tous.'
            example: en_attente
            enum:
              - en_attente
              - actif
              - refuse
              - tous
            nullable: true
        -
          in: query
          name: page
          description: 'Numéro de page (20 résultats par page). Le champ value doit être au moins égal à 1.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Numéro de page (20 résultats par page). Le champ value doit être au moins égal à 1.'
            example: 1
            nullable: true
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 0198a1b2-0000-7000-8000-000000000002
                      nom: Diop
                      prenom: Moussa
                      nomEntreprise: 'Garage Moussa'
                      metier: mecanique
                      quartier: Malika
                      statutCompte: en_attente
                      dateSoumission: '2026-10-12T09:30:00+00:00'
                      nombreJustificatifs: 2
                  links:
                    first: 'https://api.exemple.test/api/v1/admin/prestataires/demandes?page=1'
                    last: 'https://api.exemple.test/api/v1/admin/prestataires/demandes?page=1'
                    prev: null
                    next: null
                  meta:
                    current_page: 1
                    last_page: 1
                    per_page: 20
                    total: 1
                properties:
                  data:
                    type: array
                    example:
                      -
                        id: 0198a1b2-0000-7000-8000-000000000002
                        nom: Diop
                        prenom: Moussa
                        nomEntreprise: 'Garage Moussa'
                        metier: mecanique
                        quartier: Malika
                        statutCompte: en_attente
                        dateSoumission: '2026-10-12T09:30:00+00:00'
                        nombreJustificatifs: 2
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: 0198a1b2-0000-7000-8000-000000000002
                        nom:
                          type: string
                          example: Diop
                        prenom:
                          type: string
                          example: Moussa
                        nomEntreprise:
                          type: string
                          example: 'Garage Moussa'
                        metier:
                          type: string
                          example: mecanique
                        quartier:
                          type: string
                          example: Malika
                        statutCompte:
                          type: string
                          example: en_attente
                        dateSoumission:
                          type: string
                          example: '2026-10-12T09:30:00+00:00'
                        nombreJustificatifs:
                          type: integer
                          example: 2
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                        example: 'https://api.exemple.test/api/v1/admin/prestataires/demandes?page=1'
                      last:
                        type: string
                        example: 'https://api.exemple.test/api/v1/admin/prestataires/demandes?page=1'
                      prev:
                        type: string
                        example: null
                        nullable: true
                      next:
                        type: string
                        example: null
                        nullable: true
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      last_page:
                        type: integer
                        example: 1
                      per_page:
                        type: integer
                        example: 20
                      total:
                        type: integer
                        example: 1
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Authentification requise.'
                properties:
                  message:
                    type: string
                    example: 'Authentification requise.'
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: "Vous n'avez pas le droit d'effectuer cette action."
                properties:
                  message:
                    type: string
                    example: "Vous n'avez pas le droit d'effectuer cette action."
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Le statut doit être en_attente, actif, refuse ou tous.'
                  errors:
                    statut:
                      - 'Le statut doit être en_attente, actif, refuse ou tous.'
                properties:
                  message:
                    type: string
                    example: 'Le statut doit être en_attente, actif, refuse ou tous.'
                  errors:
                    type: object
                    properties:
                      statut:
                        type: array
                        example:
                          - 'Le statut doit être en_attente, actif, refuse ou tous.'
                        items:
                          type: string
      tags:
        - "Administration — demandes d'inscription"
  '/api/v1/admin/prestataires/{id}':
    get:
      summary: "Détail d'une demande"
      operationId: dtailDuneDemande
      description: 'Coordonnées du prestataire et liste de ses justificatifs (sans chemin de stockage).'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  id: 0198a1b2-0000-7000-8000-000000000002
                  nom: Diop
                  prenom: Moussa
                  telephone: '+221771234567'
                  email: moussa@example.com
                  nomEntreprise: 'Garage Moussa'
                  metier: mecanique
                  quartier: Malika
                  adresse: 'Rue 10, près du marché'
                  statutCompte: en_attente
                  motifRefus: null
                  dateSoumission: '2026-10-12T09:30:00+00:00'
                  justificatifs:
                    -
                      id: 0198a1b2-0000-7000-8000-000000000010
                      typeDocument: cni
                      statut: en_attente
                      nomOriginal: cni.png
                      typeMime: image/png
                      taille: 184320
                properties:
                  id:
                    type: string
                    example: 0198a1b2-0000-7000-8000-000000000002
                  nom:
                    type: string
                    example: Diop
                  prenom:
                    type: string
                    example: Moussa
                  telephone:
                    type: string
                    example: '+221771234567'
                  email:
                    type: string
                    example: moussa@example.com
                  nomEntreprise:
                    type: string
                    example: 'Garage Moussa'
                  metier:
                    type: string
                    example: mecanique
                  quartier:
                    type: string
                    example: Malika
                  adresse:
                    type: string
                    example: 'Rue 10, près du marché'
                  statutCompte:
                    type: string
                    example: en_attente
                  motifRefus:
                    type: string
                    example: null
                    nullable: true
                  dateSoumission:
                    type: string
                    example: '2026-10-12T09:30:00+00:00'
                  justificatifs:
                    type: array
                    example:
                      -
                        id: 0198a1b2-0000-7000-8000-000000000010
                        typeDocument: cni
                        statut: en_attente
                        nomOriginal: cni.png
                        typeMime: image/png
                        taille: 184320
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: 0198a1b2-0000-7000-8000-000000000010
                        typeDocument:
                          type: string
                          example: cni
                        statut:
                          type: string
                          example: en_attente
                        nomOriginal:
                          type: string
                          example: cni.png
                        typeMime:
                          type: string
                          example: image/png
                        taille:
                          type: integer
                          example: 184320
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Demande introuvable.'
                properties:
                  message:
                    type: string
                    example: 'Demande introuvable.'
      tags:
        - "Administration — demandes d'inscription"
    parameters:
      -
        in: path
        name: id
        description: 'Identifiant du prestataire.'
        example: 0198a1b2-0000-7000-8000-000000000002
        required: true
        schema:
          type: string
  '/api/v1/admin/prestataires/{id}/accepter':
    post:
      summary: 'Accepter une demande'
      operationId: accepterUneDemande
      description: "Le compte passe à `actif` (le prestataire peut se connecter) et ses justificatifs à `valide`.\nSeule une demande `en_attente` peut être décidée. Aucune notification n'est envoyée : le prestataire consulte son lien de suivi."
