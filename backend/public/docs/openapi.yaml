  /api/v1/metiers:
    get:
      summary: 'Lister les métiers'
      operationId: listerLesMtiers
      description: "Métiers actifs uniquement, triés par nom. Sans authentification. Le `code` est la valeur à passer aux filtres\n(`GET /prestataires?metier=`) et à l'inscription d'un prestataire. Aucune icône n'est stockée : l'application en associe une au code."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 0198a1b2-0000-7000-8000-000000000010
                      code: coiffure
                      nom: Coiffure
                    -
                      id: 0198a1b2-0000-7000-8000-000000000011
                      code: mecanique
                      nom: Mécanique
                properties:
                  data:
                    type: array
                    example:
                      -
                        id: 0198a1b2-0000-7000-8000-000000000010
                        code: coiffure
                        nom: Coiffure
                      -
                        id: 0198a1b2-0000-7000-8000-000000000011
                        code: mecanique
                        nom: Mécanique
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: 0198a1b2-0000-7000-8000-000000000010
                        code:
                          type: string
                          example: coiffure
                        nom:
                          type: string
                          example: Coiffure
      tags:
        - 'Référentiels publics'
      security: []
  /api/v1/quartiers:
    get:
      summary: 'Lister les quartiers'
      operationId: listerLesQuartiers
      description: "Sans paramètre : quartiers où au moins un prestataire au compte actif est installé, sans doublon (casse et espaces\nsuperflus ignorés), triés par ordre alphabétique. C'est la liste de la recherche des clients.\n\nAvec `tous=1` : liste complète pour l'inscription d'un prestataire, c'est-à-dire le référentiel des quartiers (table\n`quartiers`) réuni aux quartiers des prestataires actifs, sans doublon (casse, accents et espaces en trop ignorés), triée\nsans tenir compte des accents. Le référentiel n'est qu'une liste de suggestions : le quartier d'un prestataire reste un texte libre.\n\nSans authentification. Passez la valeur telle quelle au filtre `GET /prestataires?quartier=`."
      parameters:
        -
          in: query
          name: tous
          description: 'Mettre `1` (ou `true`) pour obtenir le référentiel complet. Toute autre valeur est ignorée.'
          example: true
          required: false
          schema:
            type: boolean
            description: 'Mettre `1` (ou `true`) pour obtenir le référentiel complet. Toute autre valeur est ignorée.'
            example: true
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    - Jaxaay
                    - 'Keur Massar Nord'
                    - Malika
                properties:
                  data:
                    type: array
                    example:
                      - Jaxaay
                      - 'Keur Massar Nord'
                      - Malika
                    items:
                      type: string
      tags:
        - 'Référentiels publics'
      security: []
