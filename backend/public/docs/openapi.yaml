  /api/v1/prestataire/agenda/indisponibilites:
    post:
      summary: 'Déclarer une indisponibilité'
      operationId: dclarerUneIndisponibilit
      description: "Rend `indisponible` tous les créneaux qui chevauchent la plage, en une seule transaction (tout ou rien).\nLes créneaux libres (verrous expirés compris) sont bloqués ; un verrou en cours est supprimé puis le créneau est bloqué ;\npour un créneau réservé, la réservation (en attente, acceptée ou confirmée) est annulée par le prestataire, puis le créneau est bloqué.\nLe client sera remboursé intégralement et prévenu (paiements et notifications : pas encore disponibles).\nSi une prestation est en cours dans la plage, rien n'est modifié (409). Un créneau réservé dont la prestation est terminée reste inchangé.\nRéponse : `creneauxBloques` (libres), `creneauxVerrouilles` (verrous supprimés), `creneauxReserves` et `reservationsAnnulees` (réservations annulées).\nIdempotent. Plage de 90 jours au maximum. Il n'existe pas encore de route pour lever une indisponibilité."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  creneauxBloques: 4
                  creneauxReserves: 1
                  creneauxVerrouilles: 0
                  reservationsAnnulees: 1
                properties:
                  creneauxBloques:
                    type: integer
                    example: 4
                  creneauxReserves:
                    type: integer
                    example: 1
                  creneauxVerrouilles:
                    type: integer
                    example: 0
                  reservationsAnnulees:
                    type: integer
                    example: 1
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Authentification requise.'
                properties:
                  message:
                    type: string
                    example: 'Authentification requise.'
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: "Vous n'avez pas le droit d'effectuer cette action."
                properties:
                  message:
                    type: string
                    example: "Vous n'avez pas le droit d'effectuer cette action."
        409:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: "Une prestation est en cours dans cette plage : l'indisponibilité ne peut pas être déclarée."
                properties:
                  message:
                    type: string
                    example: "Une prestation est en cours dans cette plage : l'indisponibilité ne peut pas être déclarée."
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'La fin doit être après le début.'
                  errors:
                    fin:
                      - 'La fin doit être après le début.'
                properties:
                  message:
                    type: string
                    example: 'La fin doit être après le début.'
                  errors:
                    type: object
                    properties:
                      fin:
                        type: array
                        example:
                          - 'La fin doit être après le début.'
                        items:
                          type: string
      tags:
        - 'Prestataire — agenda'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                debut:
                  type: string
                  description: 'Début (AAAA-MM-JJ HH:MM, fuseau Africa/Dakar). Peut être passé ou présent. Must be a valid date in the format <code>Y-m-d H:i</code>.'
                  example: '2030-01-15 08:00'
                fin:
                  type: string
                  description: 'Fin (AAAA-MM-JJ HH:MM), après le début et dans le futur. Plage de 90 jours au maximum. Must be a valid date in the format <code>Y-m-d H:i</code>.'
                  example: '2030-01-20 18:00'
                motif:
                  type: string
                  description: 'Motif (congé, urgence...). Facultatif, non conservé. Le champ value ne doit pas dépasser 255 caractères.'
                  example: Congé
                  nullable: true
              required:
                - debut
                - fin
