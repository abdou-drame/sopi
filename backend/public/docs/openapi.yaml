openapi: 3.0.3
info:
  title: 'Sopi API'
  description: 'API REST de Sopi (réservation de services de proximité à Keur Massar). Préfixe /api/v1, JSON uniquement, erreurs en français : { "message": "...", "errors": { "champ": ["..."] } }.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: "Administration — demandes d'inscription"
    description: "\nRoutes réservées aux administrateurs (jeton Sanctum + rôle `administrateur`)."
  -
    name: "Client — agenda d'un prestataire"
    description: "\nRoutes réservées aux clients (jeton Sanctum + rôle `client`). Seuls les prestataires dont le compte est actif sont visibles."
  -
    name: "Client — profil public d'un prestataire"
    description: "\nRoutes réservées aux clients (jeton Sanctum + rôle `client`). Seuls les prestataires dont le compte est actif sont visibles."
  -
    name: 'Client — recherche de prestataires'
    description: "\nRoutes réservées aux clients (jeton Sanctum + rôle `client`)."
  -
    name: 'Client — réservations'
    description: "\nRoutes réservées aux clients (jeton Sanctum + rôle `client`). La création est limitée à 20 requêtes par minute et par utilisateur, l'annulation à 30."
  -
    name: "Client — verrou d'un créneau"
    description: "\nRoutes réservées aux clients (jeton Sanctum + rôle `client`), limitées à 20 requêtes par minute et par utilisateur.\nUn client sélectionne un créneau libre : il est verrouillé pour lui pendant 5 minutes, le temps de réserver."
  -
    name: Endpoints
    description: ''
  -
    name: Prestataires
    description: ''
  -
    name: 'Prestataire — agenda'
    description: "\nRoutes réservées aux prestataires (jeton Sanctum + rôle `prestataire`). L'agenda est fait de créneaux ;\nles dates et heures sont celles du fuseau Africa/Dakar. Un prestataire ne voit et ne modifie que son propre agenda."
  -
    name: 'Prestataire — catalogue de prestations'
    description: "\nRoutes réservées aux prestataires (jeton Sanctum + rôle `prestataire`). Le domaine d'une prestation est\ntoujours le métier du prestataire : il n'est jamais saisi. Une prestation ne se supprime pas, elle se désactive."
  -
    name: 'Prestataire — demandes de réservation'
    description: "\nRoutes réservées aux prestataires (jeton Sanctum + rôle `prestataire`). Un prestataire ne voit que les réservations\nde ses propres créneaux ; celles d'un autre répondent 404, comme une réservation inexistante. Le client n'est identifié\nque par son prénom et l'initiale de son nom."
  -
    name: "Prestataire — photos d'atelier"
    description: "\nRoutes réservées aux prestataires (jeton Sanctum + rôle `prestataire`). 6 photos au plus, stockées sur un disque privé.\nLes clients voient ces photos sur le profil public du prestataire."
  -
    name: Profil
    description: "\nProfil de l'utilisateur connecté (client, prestataire ou administrateur)."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Le jeton est renvoyé par <code>POST /api/v1/auth/connexion</code> ou <code>/auth/inscription</code>.'
security:
  -
    default: []
paths:
  /api/v1/admin/prestataires/demandes:
    get:
      summary: 'Liste des demandes des prestataires'
      operationId: listeDesDemandesDesPrestataires
      description: 'Paginée (20 par page). Par défaut les demandes `en_attente`, de la plus ancienne à la plus récente.'
      parameters:
        -
          in: query
          name: statut
          description: 'en_attente (défaut), actif, refuse ou tous.'
          example: en_attente
          required: false
          schema:
            type: string
            description: 'en_attente (défaut), actif, refuse ou tous.'
            example: en_attente
            enum:
              - en_attente
              - actif
              - refuse
              - tous
            nullable: true
        -
          in: query
          name: page
          description: 'Numéro de page (20 résultats par page). Le champ value doit être au moins égal à 1.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Numéro de page (20 résultats par page). Le champ value doit être au moins égal à 1.'
            example: 1
            nullable: true
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 0198a1b2-0000-7000-8000-000000000002
                      nom: Diop
                      prenom: Moussa
                      nomEntreprise: 'Garage Moussa'
                      metier: mecanique
                      quartier: Malika
                      statutCompte: en_attente
                      dateSoumission: '2026-10-12T09:30:00+00:00'
                      nombreJustificatifs: 2
                  links:
                    first: 'https://api.exemple.test/api/v1/admin/prestataires/demandes?page=1'
                    last: 'https://api.exemple.test/api/v1/admin/prestataires/demandes?page=1'
                    prev: null
                    next: null
                  meta:
                    current_page: 1
                    last_page: 1
                    per_page: 20
                    total: 1
                properties:
                  data:
                    type: array
                    example:
                      -
                        id: 0198a1b2-0000-7000-8000-000000000002
                        nom: Diop
                        prenom: Moussa
                        nomEntreprise: 'Garage Moussa'
                        metier: mecanique
                        quartier: Malika
                        statutCompte: en_attente
                        dateSoumission: '2026-10-12T09:30:00+00:00'
                        nombreJustificatifs: 2
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: 0198a1b2-0000-7000-8000-000000000002
                        nom:
                          type: string
                          example: Diop
                        prenom:
                          type: string
                          example: Moussa
                        nomEntreprise:
                          type: string
                          example: 'Garage Moussa'
                        metier:
                          type: string
                          example: mecanique
                        quartier:
                          type: string
                          example: Malika
                        statutCompte:
                          type: string
                          example: en_attente
                        dateSoumission:
                          type: string
                          example: '2026-10-12T09:30:00+00:00'
                        nombreJustificatifs:
                          type: integer
                          example: 2
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                        example: 'https://api.exemple.test/api/v1/admin/prestataires/demandes?page=1'
                      last:
                        type: string
                        example: 'https://api.exemple.test/api/v1/admin/prestataires/demandes?page=1'
                      prev:
                        type: string
                        example: null
                        nullable: true
                      next:
                        type: string
                        example: null
                        nullable: true
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      last_page:
                        type: integer
                        example: 1
                      per_page:
                        type: integer
                        example: 20
                      total:
                        type: integer
                        example: 1
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Authentification requise.'
                properties:
                  message:
                    type: string
                    example: 'Authentification requise.'
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: "Vous n'avez pas le droit d'effectuer cette action."
                properties:
                  message:
                    type: string
                    example: "Vous n'avez pas le droit d'effectuer cette action."
        422:
