  /api/v1/prestataire/agenda/plages:
    post:
      summary: "Configurer l'agenda"
      operationId: configurerLagenda
      description: "Génère des créneaux LIBRES, consécutifs, de `duree_creneau_minutes` entre `heure_debut` et `heure_fin` pour chaque plage,\npuis aux mêmes jours de la semaine pendant `repeter_semaines` semaines supplémentaires.\nTout ou rien : si un créneau en chevauche un autre (existant, quel que soit son statut, ou de la même requête), rien n'est créé (422).\nLimites : 7 plages, créneaux de 15 à 480 minutes, 8 semaines de répétition, 500 créneaux par requête.\nLa liste `creneaux` n'est renvoyée que si elle compte 200 créneaux au plus."
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  nombreCreneaux: 2
                  creneaux:
                    -
                      id: 0198a1b2-0000-7000-8000-000000000040
                      dateDebut: '2030-01-15T09:00:00+00:00'
                      dateFin: '2030-01-15T10:00:00+00:00'
                      statut: libre
                    -
                      id: 0198a1b2-0000-7000-8000-000000000041
                      dateDebut: '2030-01-15T10:00:00+00:00'
                      dateFin: '2030-01-15T11:00:00+00:00'
                      statut: libre
                properties:
                  nombreCreneaux:
                    type: integer
                    example: 2
                  creneaux:
                    type: array
                    example:
                      -
                        id: 0198a1b2-0000-7000-8000-000000000040
                        dateDebut: '2030-01-15T09:00:00+00:00'
                        dateFin: '2030-01-15T10:00:00+00:00'
                        statut: libre
                      -
                        id: 0198a1b2-0000-7000-8000-000000000041
                        dateDebut: '2030-01-15T10:00:00+00:00'
                        dateFin: '2030-01-15T11:00:00+00:00'
                        statut: libre
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: 0198a1b2-0000-7000-8000-000000000040
                        dateDebut:
                          type: string
                          example: '2030-01-15T09:00:00+00:00'
                        dateFin:
                          type: string
                          example: '2030-01-15T10:00:00+00:00'
                        statut:
                          type: string
                          example: libre
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Authentification requise.'
                properties:
                  message:
                    type: string
                    example: 'Authentification requise.'
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: "Vous n'avez pas le droit d'effectuer cette action."
                properties:
                  message:
                    type: string
                    example: "Vous n'avez pas le droit d'effectuer cette action."
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Le créneau du 15/01/2030 de 09:00 à 10:00 chevauche un créneau existant (09:30 à 10:30).'
                  errors:
                    plages:
                      - 'Le créneau du 15/01/2030 de 09:00 à 10:00 chevauche un créneau existant (09:30 à 10:30).'
                properties:
                  message:
                    type: string
                    example: 'Le créneau du 15/01/2030 de 09:00 à 10:00 chevauche un créneau existant (09:30 à 10:30).'
                  errors:
                    type: object
                    properties:
                      plages:
                        type: array
                        example:
                          - 'Le créneau du 15/01/2030 de 09:00 à 10:00 chevauche un créneau existant (09:30 à 10:30).'
                        items:
                          type: string
      tags:
        - 'Prestataire — agenda'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                plages:
                  type: array
                  description: ''
                  example: null
                  items:
                    type: object
                    properties:
                      date:
                        type: string
                        description: "Date (AAAA-MM-JJ), aujourd'hui ou plus tard. Must be a valid date in the format <code>Y-m-d</code>. validation.after_or_equal."
                        example: '2030-01-15'
                      heure_debut:
                        type: string
                        description: 'Heure de début (HH:MM). Must be a valid date in the format <code>H:i</code>.'
                        example: '09:00'
                      heure_fin:
                        type: string
                        description: "Heure de fin (HH:MM), après l'heure de début. La plage doit contenir un nombre entier de créneaux. Must be a valid date in the format <code>H:i</code>."
                        example: '12:00'
                      duree_creneau_minutes:
                        type: integer
                        description: "Durée d'un créneau, de 15 à 480 minutes. Le champ value doit être au moins égal à 15. Le champ value ne doit pas dépasser 480."
                        example: 60
                      repeter_semaines:
                        type: integer
                        description: 'Nombre de semaines supplémentaires où répéter la plage (0 à 8, 0 par défaut). Le champ value doit être au moins égal à 0. Le champ value ne doit pas dépasser 8.'
