                    last: 'https://api.exemple.test/api/v1/admin/prestataires/demandes?page=1'
                    prev: null
                    next: null
                  meta:
                    current_page: 1
                    last_page: 1
                    per_page: 20
                    total: 1
                properties:
                  data:
                    type: array
                    example:
                      -
                        id: 0198a1b2-0000-7000-8000-000000000002
                        nom: Diop
                        prenom: Moussa
                        nomEntreprise: 'Garage Moussa'
                        metier: mecanique
                        quartier: Malika
