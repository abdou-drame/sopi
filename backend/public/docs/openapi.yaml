      summary: 'Refuser une demande'
      operationId: refuserUneDemande
      description: "Le compte passe à `refuse`, ses justificatifs à `rejete` et le motif est enregistré (visible sur le lien de suivi du prestataire).\nSeule une demande `en_attente` peut être décidée."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  id: 0198a1b2-0000-7000-8000-000000000002
                  nom: Diop
                  prenom: Moussa
                  telephone: '+221771234567'
                  email: moussa@example.com
                  nomEntreprise: 'Garage Moussa'
                  metier: mecanique
                  quartier: Malika
                  adresse: 'Rue 10, près du marché'
                  statutCompte: refuse
                  motifRefus: 'La photocopie de la CNI est illisible.'
                  dateSoumission: '2026-10-12T09:30:00+00:00'
                  justificatifs:
                    -
                      id: 0198a1b2-0000-7000-8000-000000000010
                      typeDocument: cni
                      statut: rejete
                      nomOriginal: cni.png
                      typeMime: image/png
                      taille: 184320
                properties:
                  id:
                    type: string
                    example: 0198a1b2-0000-7000-8000-000000000002
                  nom:
                    type: string
                    example: Diop
                  prenom:
                    type: string
                    example: Moussa
                  telephone:
                    type: string
                    example: '+221771234567'
                  email:
                    type: string
                    example: moussa@example.com
                  nomEntreprise:
                    type: string
                    example: 'Garage Moussa'
                  metier:
                    type: string
                    example: mecanique
                  quartier:
                    type: string
                    example: Malika
                  adresse:
                    type: string
                    example: 'Rue 10, près du marché'
                  statutCompte:
                    type: string
                    example: refuse
                  motifRefus:
                    type: string
                    example: 'La photocopie de la CNI est illisible.'
                  dateSoumission:
                    type: string
                    example: '2026-10-12T09:30:00+00:00'
                  justificatifs:
                    type: array
                    example:
                      -
                        id: 0198a1b2-0000-7000-8000-000000000010
                        typeDocument: cni
                        statut: rejete
                        nomOriginal: cni.png
                        typeMime: image/png
                        taille: 184320
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: 0198a1b2-0000-7000-8000-000000000010
                        typeDocument:
                          type: string
                          example: cni
                        statut:
                          type: string
                          example: rejete
                        nomOriginal:
                          type: string
                          example: cni.png
                        typeMime:
                          type: string
                          example: image/png
                        taille:
                          type: integer
                          example: 184320
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Demande introuvable.'
                properties:
                  message:
                    type: string
                    example: 'Demande introuvable.'
        409:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Cette demande a déjà été traitée.'
                properties:
                  message:
                    type: string
                    example: 'Cette demande a déjà été traitée.'
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Le motif du refus doit contenir au moins 10 caractères.'
                  errors:
                    motif:
                      - 'Le motif du refus doit contenir au moins 10 caractères.'
                properties:
                  message:
                    type: string
                    example: 'Le motif du refus doit contenir au moins 10 caractères.'
                  errors:
                    type: object
                    properties:
                      motif:
                        type: array
                        example:
                          - 'Le motif du refus doit contenir au moins 10 caractères.'
                        items:
                          type: string
