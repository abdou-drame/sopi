# Configuration Nixpacks pour Dokploy (service « backend », Build Path : /backend).
# Les extensions PHP (dont pdo_pgsql) sont déduites des « ext-* » de composer.json.
#
# Nginx : ne PAS définir NIXPACKS_PHP_ROOT_DIR ni NIXPACKS_PHP_FALLBACK_PATH.
# Nixpacks détecte Laravel (fichier « artisan ») et configure seul la racine /app/public
# et le « location / » vers index.php. Ajouter NIXPACKS_PHP_FALLBACK_PATH crée un second
# « location / » et nginx refuse de démarrer (« duplicate location "/" »).

[variables]
NIXPACKS_PHP_VERSION = "8.3"

[phases.build]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist",
  "mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache",
  "chmod -R 777 storage bootstrap/cache",
]

# Au démarrage : migrations, caches Laravel, puis nginx + php-fpm (démarrage par défaut de Nixpacks PHP).
# php-fpm -F : sans cet indicateur php-fpm se détache (daemonize) et la sortie des workers (logs Laravel sur stderr,
# relayée par catch_workers_output) n’atteint pas les logs du conteneur. Le « & » garde le processus en arrière-plan.
#
# Dépôt des justificatifs (jusqu'à 5 fichiers de 5 Mo) : les limites par défaut sont trop basses
# (nginx client_max_body_size = 1m ; PHP upload_max_filesize = 2M, post_max_size = 8M).
#  - nginx : après génération de /etc/nginx.conf, on ajoute « client_max_body_size 30m; » dans chaque bloc « server { ».
#  - PHP-FPM : upload_max_filesize = 6M par fichier, post_max_size = 30M par requête (passés avec -d).
[start]
cmd = "php artisan migrate --force && php artisan config:cache && php artisan route:cache && node /assets/scripts/prestart.mjs /assets/nginx.template.conf /etc/nginx.conf && sed -i 's/server {/server { client_max_body_size 30m;/' /etc/nginx.conf && (php-fpm -F -y /assets/php-fpm.conf -d upload_max_filesize=6M -d post_max_size=30M & nginx -c /etc/nginx.conf)"
