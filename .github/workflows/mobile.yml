name: Mobile (APK)

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FLUTTER_VERSION: '3.41.2'
  API_BASE_URL: 'https://sopi-api.duckdns.org'
  APK_NOM: sopi-v0.1.${{ github.run_number }}.apk

jobs:
  build:
    name: Tests et construction de l'APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Installer les dépendances
        run: flutter pub get

      - name: Analyse statique
        run: flutter analyze

      - name: Tests
        run: flutter test

      # Signature : les secrets ne sont lus que par cette étape (variables d'environnement,
      # jamais écrites dans la commande). Le keystore et key.properties n'existent que
      # pendant le build, dans le répertoire temporaire du runner.
      - name: Préparer la signature
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] \
             && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sopi-release.jks"
            {
              echo "storeFile=$RUNNER_TEMP/sopi-release.jks"
              echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
              echo "keyAlias=$ANDROID_KEY_ALIAS"
              echo "keyPassword=$ANDROID_KEY_PASSWORD"
            } > android/key.properties
            echo "Signature : release (clé du dépôt)."
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "::error title=Secrets de signature manquants::Sur main, la signature release est obligatoire. Définir ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS et ANDROID_KEY_PASSWORD dans Settings > Secrets and variables > Actions."
            exit 1
          else
            echo "::warning::Secrets de signature absents : APK signé avec la clé de debug (non publiable)."
          fi

      - name: Construire l'APK release
        run: >
          flutter build apk --release
          --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}
          --build-name=0.1.${{ github.run_number }}
          --build-number=${{ github.run_number }}

      - name: Nommer l'APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "$APK_NOM"

      - name: Publier l'APK comme artefact du workflow
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NOM }}
          path: mobile/${{ env.APK_NOM }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publier la release GitHub
    # Uniquement sur un push vers main (jamais sur feature/* ni sur pull request).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.APK_NOM }}

      - name: Créer la release avec l'APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="mobile-v0.1.${{ github.run_number }}"
          gh release create "$TAG" "$APK_NOM" \
            --target "$GITHUB_SHA" \
            --title "Sopi v0.1.${{ github.run_number }}" \
            --notes "APK Android construit depuis le commit ${GITHUB_SHA::7} (exécution n°${{ github.run_number }})."
