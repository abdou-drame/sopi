# Configuration Nixpacks pour Dokploy (service « frontend », Build Path : /admin-web).
#
# Nixpacks détecte une application Vite + React (monopage) et fait tout seul :
#   - installation : npm ci ; build : npm run build (sortie dans dist/) ;
#   - service statique avec Caddy, repli vers index.html pour toutes les routes,
#     sur le port $PORT (3000 par défaut).
# On ne redéfinit donc ni phases, ni commande de démarrage, ni NIXPACKS_SPA_OUTPUT_DIR.
#
# VITE_API_BASE_URL est lue AU BUILD : à fournir comme variable d'environnement dans Dokploy.

[variables]
NIXPACKS_NODE_VERSION = "22"
