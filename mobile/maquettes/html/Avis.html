<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Laisser un avis</title><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
body{margin:0}
button,textarea{font-family:inherit}
</style></head><body>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #f5f6fa; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #12172b">

  <div style="position: absolute; left: 20px; right: 20px; top: 24px">
    <button aria-label="Fermer" style="width: 44px; height: 44px; border: none; border-radius: 22px; background: #ffffff; box-shadow: 0 2px 8px rgba(18,23,43,0.08); display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#12172b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>

  <div style="position: absolute; left: 24px; right: 24px; top: 92px; font-size: 30px; line-height: 36px; font-weight: 400">Comment s'est<br><span style="font-weight: 800">passée la prestation ?</span></div>

  <div style="position: absolute; left: 16px; right: 16px; top: 250px; box-sizing: border-box; padding: 22px 20px; border: none; box-shadow: 0 1px 3px rgba(18,23,43,0.06); border-radius: 30px; background: #ffffff">
    <div style="text-align: center; font-size: 15px; font-weight: 700">Salon Fatou</div>
    <div style="text-align: center; font-size: 13px; color: #6b7287">Coupe femme · 24 oct.</div>
    <div style="margin-top: 18px; display: flex; justify-content: center; gap: 10px">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>
      <svg width="40" height="40" viewBox="0 0 24 24" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>
      <svg width="40" height="40" viewBox="0 0 24 24" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>
      <svg width="40" height="40" viewBox="0 0 24 24" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#8a90a2" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>
    </div>
    <div style="margin-top: 8px; text-align: center; font-size: 13px; font-weight: 600; color: #1d4ed8">Très bien</div>

    <label style="margin-top: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #6b7287">Votre commentaire (facultatif)
      <textarea style="height: 110px; box-sizing: border-box; padding: 14px; border: none; border-radius: 18px; background: #f1f3f8; font-size: 14px; color: #12172b; resize: none">Accueil chaleureux et travail soigné.</textarea>
    </label>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 24px; display: flex; flex-direction: column; gap: 10px">
    <button style="height: 54px; border: none; border-radius: 27px; background: #1d4ed8; color: #ffffff; font-size: 16px; font-weight: 700">Publier mon avis</button>
    <div style="text-align: center; font-size: 12px; color: #6b7287">Votre avis est visible immédiatement sur la fiche du prestataire.</div>
  </div>

</div>
</body></html>
