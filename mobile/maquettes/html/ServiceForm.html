<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Service</title><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
body{margin:0}
button,input,textarea{font-family:inherit}
</style></head><body>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #f5f6fa; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #12172b">
  <div style="position: absolute; left: 20px; right: 20px; top: 24px; display: flex; align-items: center; justify-content: space-between">
    <button aria-label="Retour" style="width: 44px; height: 44px; border: none; border-radius: 22px; background: #ffffff; box-shadow: 0 2px 8px rgba(18,23,43,0.08); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#12172b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
  </div>
  <div style="position: absolute; left: 24px; right: 24px; top: 92px; font-size: 30px; line-height: 36px; font-weight: 400">Ajouter un<br><span style="font-weight: 800">service</span></div>
  <div style="position: absolute; left: 16px; right: 16px; top: 214px; box-sizing: border-box; padding: 20px; border: none; box-shadow: 0 1px 3px rgba(18,23,43,0.06); border-radius: 30px; background: #ffffff; display: flex; flex-direction: column; gap: 14px">
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #6b7287">Nom du service
      <input type="text" value="Coupe femme" placeholder="" style="width: 100%; min-width: 0; height: 50px; box-sizing: border-box; padding: 0 14px; border: none; border-radius: 18px; background: #f1f3f8; font-size: 15px; color: #12172b">
    </label>    <div><div style="font-size: 12px; font-weight: 600; color: #6b7287; margin-bottom: 8px">Durée</div><div style="display: flex; flex-wrap: wrap; gap: 8px"><span style="height: 38px; padding: 0 14px; border-radius: 19px; border: none; background: #e9ecf3; font-size: 13px; font-weight: 600; display: flex; align-items: center">30 min</span><span style="height: 38px; padding: 0 14px; border-radius: 19px; background: #1d4ed8; color: #ffffff; font-size: 13px; font-weight: 700; display: flex; align-items: center">1 h</span><span style="height: 38px; padding: 0 14px; border-radius: 19px; border: none; background: #e9ecf3; font-size: 13px; font-weight: 600; display: flex; align-items: center">1 h 30</span><span style="height: 38px; padding: 0 14px; border-radius: 19px; border: none; background: #e9ecf3; font-size: 13px; font-weight: 600; display: flex; align-items: center">2 h</span><span style="height: 38px; padding: 0 14px; border-radius: 19px; border: none; background: #e9ecf3; font-size: 13px; font-weight: 600; display: flex; align-items: center">3 h</span></div></div>    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #6b7287">Prix (FCFA)
      <input type="text" value="5000" placeholder="" style="width: 100%; min-width: 0; height: 50px; box-sizing: border-box; padding: 0 14px; border: none; border-radius: 18px; background: #f1f3f8; font-size: 15px; color: #12172b">
    </label>    <div style="box-sizing: border-box; padding: 12px 14px; border-radius: 16px; background: #e8eefc; font-size: 13px; color: #1d4ed8; font-weight: 600">L'acompte demandé au client est calculé automatiquement par Sopi.</div>    <div style="display: flex; align-items: center; justify-content: space-between"><div><div style="font-size: 15px; font-weight: 700">Service actif</div><div style="font-size: 12px; color: #6b7287">Visible et réservable par les clients</div></div><span style="width: 48px; height: 28px; border-radius: 14px; background: #1d4ed8; position: relative"><span style="position: absolute; right: 3px; top: 3px; width: 22px; height: 22px; border-radius: 11px; background: #ffffff"></span></span></div>
  </div>
  <div style="position: absolute; left: 16px; right: 16px; bottom: 24px; display: flex; flex-direction: column; gap: 10px"><button style="height: 54px; border: none; border-radius: 27px; background: #1d4ed8; color: #ffffff; font-size: 16px; font-weight: 700">Enregistrer</button></div>

</div>
</body></html>
