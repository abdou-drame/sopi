<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Dossier refusé</title><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
body{margin:0}
button{font-family:inherit}
</style></head><body>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #f5f6fa; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #12172b">

  <div style="position: absolute; left: 0; right: 0; top: 80px; display: flex; flex-direction: column; align-items: center; gap: 20px">
    <div style="width: 104px; height: 104px; border-radius: 52px; background: #fde9e9; display: flex; align-items: center; justify-content: center">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#b0161b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </div>
    <div style="text-align: center; font-size: 28px; line-height: 34px; font-weight: 400">Dossier<br><span style="font-weight: 800">non retenu</span></div>
    <div style="font-size: 14px; color: #6b7287; text-align: center; padding: 0 36px; line-height: 20px">Votre demande d'inscription n'a pas été acceptée.</div>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; top: 408px; box-sizing: border-box; padding: 18px; border-radius: 26px; background: #dbeafe">
    <div style="font-size: 12px; font-weight: 700; color: #1d4ed8">Motif du refus</div>
    <div style="margin-top: 6px; font-size: 14px; line-height: 20px; color: #1e3a8a">La carte d'identité est illisible. Merci de fournir une photo plus nette.</div>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; top: 540px; box-sizing: border-box; padding: 18px; border: none; box-shadow: 0 1px 3px rgba(18,23,43,0.06); border-radius: 26px; background: #ffffff; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; font-size: 14px"><span style="color: #6b7287">Entreprise</span><span style="font-weight: 700">Salon Fatou</span></div>
    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 14px"><span>Carte d'identité</span><span style="height: 26px; padding: 0 12px; border-radius: 13px; background: #1d4ed8; color: #ffffff; font-size: 12px; font-weight: 700; display: flex; align-items: center">Refusé</span></div>
    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 14px"><span>Diplôme ou attestation</span><span style="height: 26px; padding: 0 12px; border-radius: 13px; background: #1d4ed8; color: #ffffff; font-size: 12px; font-weight: 700; display: flex; align-items: center">Refusé</span></div>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 24px; display: flex; flex-direction: column; gap: 10px">
    <button style="height: 54px; border: none; border-radius: 27px; background: #1d4ed8; color: #ffffff; font-size: 16px; font-weight: 700">Contacter le support</button>
    <button style="height: 50px; border: none; border-radius: 25px; background: #e9ecf3; color: #12172b; font-size: 14px; font-weight: 600">Retour à la connexion</button>
  </div>

</div>
</body></html>
