<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Inscription prestataire : vos informations</title><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
body{margin:0}
button,input{font-family:inherit}
</style></head><body>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #f5f6fa; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #12172b">

  <div style="position: absolute; left: 20px; right: 20px; top: 24px; display: flex; align-items: center; justify-content: space-between">

      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#12172b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
    </button>
    <div style="font-size: 13px; font-weight: 600; color: #6b7287">Étape 2 sur 3</div>
  </div>

  <div style="position: absolute; left: 24px; right: 24px; top: 84px; display: flex; gap: 6px">
    <span style="flex: 1; height: 6px; border-radius: 3px; background: #1d4ed8"></span>
    <span style="flex: 1; height: 6px; border-radius: 3px; background: #1d4ed8"></span>
    <span style="flex: 1; height: 6px; border-radius: 3px; background: #c7d2fe"></span>
  </div>

  <div style="position: absolute; left: 24px; right: 24px; top: 112px; font-size: 28px; line-height: 34px; font-weight: 400">Vos<br><span style="font-weight: 800">informations</span></div>

  <div style="position: absolute; left: 16px; right: 16px; top: 214px; box-sizing: border-box; padding: 20px; border-radius: 30px; background: #ffffff; border: none; box-shadow: 0 1px 3px rgba(18,23,43,0.06); display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; gap: 10px"><div style="flex: 1"><label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #6b7287">Prénom
      <input type="text" value="Fatou" style="height: 50px; box-sizing: border-box; padding: 0 14px; border: none; border-radius: 18px; background: #f1f3f8; font-size: 15px; color: #12172b">
    </label></div><div style="flex: 1"><label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #6b7287">Nom
      <input type="text" value="Ndiaye" style="height: 50px; box-sizing: border-box; padding: 0 14px; border: none; border-radius: 18px; background: #f1f3f8; font-size: 15px; color: #12172b">
    </label></div></div>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #6b7287">Téléphone
      <input type="tel" value="+221 77 000 00 00" style="height: 50px; box-sizing: border-box; padding: 0 14px; border: none; border-radius: 18px; background: #f1f3f8; font-size: 15px; color: #12172b">
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #6b7287">E-mail (pour le suivi de votre dossier)
      <input type="email" value="fatou@exemple.sn" style="height: 50px; box-sizing: border-box; padding: 0 14px; border: none; border-radius: 18px; background: #f1f3f8; font-size: 15px; color: #12172b">
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #6b7287">Mot de passe
      <input type="password" value="motdepasse" style="height: 50px; box-sizing: border-box; padding: 0 14px; border: none; border-radius: 18px; background: #f1f3f8; font-size: 15px; color: #12172b">
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #6b7287">Confirmer le mot de passe
      <input type="password" value="motdepasse" style="height: 50px; box-sizing: border-box; padding: 0 14px; border: none; border-radius: 18px; background: #f1f3f8; font-size: 15px; color: #12172b">
    </label>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 24px">
    <button style="width: 100%; height: 54px; border: none; border-radius: 27px; background: #1d4ed8; color: #ffffff; font-size: 16px; font-weight: 700">Continuer</button>
  </div>

</div>
