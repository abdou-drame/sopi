<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Inscription prestataire, justificatifs</title><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
body{margin:0}
button{font-family:inherit}
</style></head><body>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #f5f6fa; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #12172b">

  <div style="position: absolute; left: 20px; right: 20px; top: 24px; display: flex; align-items: center; justify-content: space-between">
    <button aria-label="Retour" style="width: 44px; height: 44px; border: none; border-radius: 22px; background: #ffffff; box-shadow: 0 2px 8px rgba(18,23,43,0.08); display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#12172b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
    </button>
    <div style="font-size: 13px; font-weight: 600; color: #6b7287">Étape 3 sur 3</div>
  </div>

  <div style="position: absolute; left: 24px; right: 24px; top: 84px; display: flex; gap: 6px">
    <span style="flex: 1; height: 6px; border-radius: 3px; background: #1d4ed8"></span>
    <span style="flex: 1; height: 6px; border-radius: 3px; background: #1d4ed8"></span>
    <span style="flex: 1; height: 6px; border-radius: 3px; background: #1d4ed8"></span>
  </div>

  <div style="position: absolute; left: 24px; right: 24px; top: 112px; font-size: 28px; line-height: 34px; font-weight: 400">Vos<br><span style="font-weight: 800">justificatifs</span></div>

  <div style="position: absolute; left: 24px; right: 24px; top: 214px; font-size: 13px; line-height: 19px; color: #6b7287">Ajoutez une photo nette ou un PDF de chaque document. Un administrateur les vérifie sous quelques jours.</div>

  <div style="position: absolute; left: 16px; right: 16px; top: 270px; display: flex; flex-direction: column; gap: 12px">

    <div style="display: flex; align-items: center; gap: 14px; box-sizing: border-box; padding: 14px 16px; border: none; box-shadow: 0 1px 3px rgba(18,23,43,0.06); border-radius: 24px; background: #ffffff">
      <div style="width: 48px; height: 48px; border-radius: 16px; background: #dbeafe; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>
      </div>
      <div style="flex-grow: 1">
        <div style="font-size: 15px; font-weight: 700">Carte d'identité</div>
        <div style="font-size: 12px; color: #1d4ed8; font-weight: 600">cni-fatou.pdf · ajouté</div>
      </div>
      <button style="height: 36px; padding: 0 14px; border: none; border-radius: 18px; background: #e9ecf3; font-size: 12px; font-weight: 600; color: #12172b">Changer</button>
    </div>

    <div style="display: flex; align-items: center; gap: 14px; box-sizing: border-box; padding: 14px 16px; border: none; box-shadow: 0 1px 3px rgba(18,23,43,0.06); border-radius: 24px; background: #ffffff">
      <div style="width: 48px; height: 48px; border-radius: 16px; background: #dbeafe; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>
      </div>
      <div style="flex-grow: 1">
        <div style="font-size: 15px; font-weight: 700">Diplôme ou attestation</div>
        <div style="font-size: 12px; color: #1d4ed8; font-weight: 600">diplome.pdf · ajouté</div>
      </div>
      <button style="height: 36px; padding: 0 14px; border: none; border-radius: 18px; background: #e9ecf3; font-size: 12px; font-weight: 600; color: #12172b">Changer</button>
    </div>

    <div style="display: flex; align-items: center; gap: 14px; box-sizing: border-box; padding: 14px 16px; border: 2px dashed #8a90a2; border-radius: 24px; background: #f1f3f8">
      <div style="width: 48px; height: 48px; border-radius: 16px; background: #ffffff; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </div>
      <div style="flex-grow: 1">
        <div style="font-size: 15px; font-weight: 700">Justificatif d'activité</div>
        <div style="font-size: 12px; color: #6b7287">Photo de votre local ou registre (facultatif)</div>
      </div>
    </div>

  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 24px">
    <button style="width: 100%; height: 54px; border: none; border-radius: 27px; background: #1d4ed8; color: #ffffff; font-size: 16px; font-weight: 700">Envoyer mon dossier</button>
  </div>

</div>
