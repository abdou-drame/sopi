<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Mes réservations</title><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
body{margin:0}
button{font-family:inherit}
</style></head><body>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #f5f6fa; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #12172b">

  <div style="position: absolute; left: 24px; right: 24px; top: 40px; font-size: 30px; line-height: 36px; font-weight: 400">Mes<br><span style="font-weight: 800">réservations</span></div>

  <div style="position: absolute; left: 16px; right: 16px; top: 150px; height: 48px; box-sizing: border-box; padding: 4px; border-radius: 24px; background: #e9ecf3; display: flex; gap: 4px">
    <button style="flex: 1; border: none; border-radius: 20px; background: #1d4ed8; color: #ffffff; font-size: 13px; font-weight: 700">À venir</button>
    <button style="flex: 1; border: none; border-radius: 20px; background: transparent; color: #6b7287; font-size: 13px; font-weight: 600">Terminées</button>
    <button style="flex: 1; border: none; border-radius: 20px; background: transparent; color: #6b7287; font-size: 13px; font-weight: 600">Annulées</button>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; top: 224px; display: flex; flex-direction: column; gap: 12px">

    <div style="box-sizing: border-box; padding: 16px; border: none; box-shadow: 0 1px 3px rgba(18,23,43,0.06); border-radius: 26px; background: #ffffff">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <div style="font-size: 16px; font-weight: 700">Salon Fatou</div>
        <span style="height: 26px; padding: 0 12px; border-radius: 13px; background: #dbeafe; color: #1d4ed8; font-size: 12px; font-weight: 700; display: flex; align-items: center">Confirmée</span>
      </div>
      <div style="margin-top: 4px; font-size: 13px; color: #6b7287">Coupe femme · Sam. 24 oct., 10h00</div>
      <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 14px">
        <div style="font-size: 13px; color: #6b7287">Acompte payé <span style="font-weight: 700; color: #12172b">1 500 FCFA</span></div>
        <button style="height: 38px; padding: 0 16px; border: none; border-radius: 19px; background: #e9ecf3; color: #12172b; font-size: 13px; font-weight: 600">Annuler</button>
      </div>
    </div>

    <div style="box-sizing: border-box; padding: 16px; border: none; box-shadow: 0 1px 3px rgba(18,23,43,0.06); border-radius: 26px; background: #ffffff">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <div style="font-size: 16px; font-weight: 700">Garage Keur Massar</div>
        <span style="height: 26px; padding: 0 12px; border-radius: 13px; background: #e0e7ff; color: #3730a3; font-size: 12px; font-weight: 700; display: flex; align-items: center">Acceptée</span>
      </div>
      <div style="margin-top: 4px; font-size: 13px; color: #6b7287">Vidange · Lun. 26 oct., 15h00</div>
      <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 14px">
        <div style="font-size: 13px; color: #6b7287">Acompte <span style="font-weight: 700; color: #12172b">3 000 FCFA</span> à payer</div>
        <button style="height: 38px; padding: 0 16px; border: none; border-radius: 19px; background: #1d4ed8; color: #ffffff; font-size: 13px; font-weight: 700">Payer</button>
      </div>
    </div>

    <div style="box-sizing: border-box; padding: 16px; border: none; box-shadow: 0 1px 3px rgba(18,23,43,0.06); border-radius: 26px; background: #ffffff">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <div style="font-size: 16px; font-weight: 700">Pressing Express</div>
        <span style="height: 26px; padding: 0 12px; border-radius: 13px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; display: flex; align-items: center">En attente</span>
      </div>
      <div style="margin-top: 4px; font-size: 13px; color: #6b7287">Costume 2 pièces · Mar. 27 oct., 09h00</div>
      <div style="margin-top: 14px; font-size: 13px; color: #6b7287">Le prestataire doit répondre à votre demande.</div>
    </div>

  </div>

  <div style="position: absolute; left: 12px; right: 12px; bottom: 14px; height: 68px; box-sizing: border-box; padding: 0 8px; border-radius: 34px; background: #ffffff; box-shadow: 0 8px 24px rgba(18,23,43,0.12); display: flex; align-items: center; justify-content: space-around">
    <button aria-label="Accueil" style="width: 48px; height: 48px; border: none; border-radius: 24px; background: transparent; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8a90a2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
    </button>
    <button aria-label="Rechercher" style="width: 48px; height: 48px; border: none; border-radius: 24px; background: transparent; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8a90a2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </button>
    <button aria-label="Mes réservations" style="height: 48px; padding: 0 18px; border: none; border-radius: 24px; background: #1d4ed8; color: #ffffff; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>Réservations
    </button>
    <button aria-label="Profil" style="width: 48px; height: 48px; border: none; border-radius: 24px; background: transparent; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8a90a2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6 8-6s8 2 8 6"/></svg>
    </button>
  </div>

</div>
</body></html>
