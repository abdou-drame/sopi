<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Connexion bloquée</title><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
body{margin:0}
button,input{font-family:inherit}
</style></head><body>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #f5f6fa; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #12172b">

  <div style="position: absolute; left: 28px; top: 72px; display: flex; align-items: center; gap: 12px">
    <div style="width: 52px; height: 52px; border-radius: 18px; background: #1d4ed8; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 800">S</div>
    <div style="font-size: 28px; font-weight: 800; letter-spacing: -0.5px">Sopi</div>
  </div>

  <div style="position: absolute; left: 28px; right: 28px; top: 176px; font-size: 32px; line-height: 38px; font-weight: 400">Heureux de<br><span style="font-weight: 800">vous revoir !</span></div>
  <div style="position: absolute; left: 16px; right: 16px; top: 258px; box-sizing: border-box; padding: 12px 16px; border-radius: 20px; background: #fee2e2; color: #b91c1c; font-size: 13px; line-height: 18px; font-weight: 600">Trop de tentatives. Votre accès est bloqué 15 minutes. Réessayez dans 14:32.</div>

  <div style="position: absolute; left: 16px; right: 16px; top: 340px; box-sizing: border-box; padding: 22px 20px 24px; border-radius: 30px; background: #ffffff; border: none; box-shadow: 0 1px 3px rgba(18,23,43,0.06); display: flex; flex-direction: column; gap: 14px">
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #6b7287">
      E-mail ou téléphone
      <input type="text" value="aminata@exemple.sn" style="height: 52px; box-sizing: border-box; padding: 0 16px; border: none; border-radius: 18px; background: #f1f3f8; font-size: 15px; color: #12172b">
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #6b7287">
      Mot de passe
      <input type="password" value="motdepasse" style="height: 52px; box-sizing: border-box; padding: 0 16px; border: 1px solid #b91c1c; border-radius: 18px; background: #f1f3f8; font-size: 15px; color: #12172b">
    </label>
    <div style="text-align: right; font-size: 13px; font-weight: 600; color: #1d4ed8">Mot de passe oublié ?</div>
    <button style="height: 54px; border: none; border-radius: 27px; background: #1d4ed8; color: #ffffff; font-size: 16px; font-weight: 700">Se connecter</button>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; top: 636px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; color: #6b7287">
    Pas encore de compte ?<span style="font-weight: 700; color: #1d4ed8">Créer un compte</span>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 28px; box-sizing: border-box; padding: 16px 18px; border-radius: 24px; background: #ffffff; box-shadow: 0 1px 3px rgba(18,23,43,0.06); color: #12172b; display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <div>
      <div style="font-size: 12px; color: #6b7287">Vous êtes professionnel ?</div>
      <div style="font-size: 15px; font-weight: 700">Devenir prestataire Sopi</div>
    </div>
    <button aria-label="Devenir prestataire" style="flex-shrink: 0; width: 44px; height: 44px; border: none; border-radius: 22px; background: #1d4ed8; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>
    </button>
  </div>

</div>
</body></html>
