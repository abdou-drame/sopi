<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Refuser une demande</title><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
body{margin:0}
button,input{font-family:inherit}
</style></head><body>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #f5f6fa; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #12172b">

  <div style="position: absolute; left: 20px; right: 20px; top: 24px">
    <button aria-label="Retour" style="width: 44px; height: 44px; border: none; border-radius: 22px; background: #ffffff; box-shadow: 0 2px 8px rgba(18,23,43,0.08); display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#12172b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
    </button>
  </div>

  <div style="position: absolute; left: 24px; right: 24px; top: 92px; font-size: 30px; line-height: 36px; font-weight: 400">Refuser<br><span style="font-weight: 800">la demande</span></div>

  <div style="position: absolute; left: 16px; right: 16px; top: 216px; box-sizing: border-box; padding: 16px 18px; border: none; box-shadow: 0 1px 3px rgba(18,23,43,0.06); border-radius: 24px; background: #ffffff">
    <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 15px; font-weight: 700">Aminata D.</span><span style="font-size: 12px; color: #6b7287">Sam. 24 oct., 10h00</span></div>
    <div style="margin-top: 2px; font-size: 13px; color: #6b7287">Coupe femme · 5 000 FCFA</div>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; top: 316px; box-sizing: border-box; padding: 20px; border-radius: 30px; background: #ffffff; border: none; box-shadow: 0 1px 3px rgba(18,23,43,0.06)">
    <div style="font-size: 12px; font-weight: 600; color: #6b7287">Motif du refus (obligatoire)</div>
    <div style="margin-top: 8px; height: 130px; box-sizing: border-box; padding: 14px 16px; border: none; border-radius: 18px; background: #f1f3f8; font-size: 15px; line-height: 21px; color: #12172b">Je ne suis pas disponible à cette heure. Vous pouvez choisir un autre créneau.</div>
    <div style="margin-top: 8px; display: flex; justify-content: space-between; font-size: 12px; color: #6b7287"><span>3 caractères minimum</span><span>77 / 500</span></div>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; top: 600px; box-sizing: border-box; padding: 14px 18px; border-radius: 22px; background: #dbeafe; font-size: 13px; line-height: 19px; color: #1e3a8a">Le client verra ce motif et pourra choisir un autre créneau.</div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 24px; display: flex; flex-direction: column; gap: 10px">
    <button style="height: 54px; border: none; border-radius: 27px; background: #1d4ed8; color: #ffffff; font-size: 16px; font-weight: 700">Confirmer le refus</button>
    <button style="height: 50px; border: none; border-radius: 25px; background: #e9ecf3; color: #12172b; font-size: 14px; font-weight: 600">Retour</button>
  </div>

</div>
</body></html>
