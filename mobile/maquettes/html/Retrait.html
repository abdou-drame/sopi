<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Demande de retrait</title><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
body{margin:0}
button,input{font-family:inherit}
</style></head><body>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #f5f6fa; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #12172b">

  <div style="position: absolute; left: 20px; right: 20px; top: 24px">
    <button aria-label="Retour" style="width: 44px; height: 44px; border: none; border-radius: 22px; background: #ffffff; box-shadow: 0 2px 8px rgba(18,23,43,0.08); display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#12172b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
    </button>
  </div>

  <div style="position: absolute; left: 24px; right: 24px; top: 92px; font-size: 30px; line-height: 36px; font-weight: 400">Retirer<br><span style="font-weight: 800">mon argent</span></div>

  <div style="position: absolute; left: 16px; right: 16px; top: 214px; box-sizing: border-box; padding: 20px; border-radius: 30px; background: #ffffff; border: none; box-shadow: 0 1px 3px rgba(18,23,43,0.06); display: flex; flex-direction: column; gap: 14px">
    <div style="font-size: 13px; color: #6b7287">Solde disponible : <span style="font-weight: 700; color: #12172b">42 500 FCFA</span></div>

    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #6b7287">Montant à retirer (FCFA)
      <input type="text" value="20 000" style="height: 60px; box-sizing: border-box; padding: 0 16px; border: none; border-radius: 18px; background: #f1f3f8; font-size: 24px; font-weight: 800; color: #12172b">
    </label>
    <div style="font-size: 12px; color: #6b7287">Minimum 1 000 FCFA, maximum 500 000 FCFA.</div>

    <div>
      <div style="font-size: 12px; font-weight: 600; color: #6b7287; margin-bottom: 8px">Recevoir sur</div>
      <div style="display: flex; gap: 10px">
        <button style="flex: 1; height: 60px; box-sizing: border-box; border: 2px solid #1d4ed8; border-radius: 20px; background: #ffffff; color: #12172b; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px"><img src="../assets/orange-money.webp" alt="" style="width: 40px; height: 40px; border-radius: 12px; object-fit: cover">Wave</button>
        <button style="flex: 1; height: 60px; box-sizing: border-box; border: none; box-shadow: 0 1px 3px rgba(18,23,43,0.06); border-radius: 20px; background: #ffffff; color: #12172b; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px"><img src="../assets/wave.png" alt="" style="width: 40px; height: 40px; border-radius: 12px; object-fit: cover">Orange Money</button>
      </div>
    </div>

    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #6b7287">Numéro de téléphone
      <input type="tel" value="+221 77 000 00 00" style="height: 52px; box-sizing: border-box; padding: 0 16px; border: none; border-radius: 18px; background: #f1f3f8; font-size: 15px; color: #12172b">
    </label>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; top: 600px; box-sizing: border-box; padding: 14px 18px; border-radius: 22px; background: #dbeafe; font-size: 13px; line-height: 19px; color: #1e3a8a">Le versement est envoyé automatiquement. Vous êtes prévenu dès qu'il est effectué.</div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 24px">
    <button style="width: 100%; height: 54px; border: none; border-radius: 27px; background: #1d4ed8; color: #ffffff; font-size: 16px; font-weight: 700">Retirer 20 000 FCFA</button>
  </div>

</div>
</body></html>
