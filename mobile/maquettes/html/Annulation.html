<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Annuler la réservation</title><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
body{margin:0}
button{font-family:inherit}
</style></head><body>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #f5f6fa; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #12172b">

  <div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: rgba(18,23,43,0.40)"></div>

  <div style="position: absolute; left: 12px; right: 12px; bottom: 12px; box-sizing: border-box; padding: 14px 20px 24px; border-radius: 36px; background: #ffffff">
    <div style="width: 44px; height: 5px; border-radius: 3px; background: #d5ddf0; margin: 0 auto 18px"></div>
    <div style="font-size: 22px; font-weight: 800; line-height: 28px">Annuler cette réservation ?</div>
    <div style="margin-top: 4px; font-size: 14px; color: #6b7287">Salon Fatou · Sam. 24 oct., 10h00</div>

    <div style="margin-top: 18px; box-sizing: border-box; padding: 14px 16px; border-radius: 22px; background: #dbeafe; font-size: 13px; line-height: 19px; color: #1e3a8a">
      Vous pouvez annuler jusqu'à 2 heures avant le rendez-vous. <b>L'acompte de 1 500 FCFA ne sera pas remboursé.</b> Il l'est seulement si c'est le prestataire qui annule.
    </div>

    <div style="margin-top: 22px; display: flex; flex-direction: column; gap: 10px">
      <button style="height: 54px; border: none; border-radius: 27px; background: #1d4ed8; color: #ffffff; font-size: 16px; font-weight: 700">Garder ma réservation</button>
      <button style="height: 50px; border: none; border-radius: 25px; background: #e9ecf3; color: #12172b; font-size: 15px; font-weight: 600">Oui, annuler</button>
    </div>
  </div>

</div>
</body></html>
