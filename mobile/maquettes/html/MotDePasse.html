<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Mot de passe oublié</title><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
body{margin:0}
button,input{font-family:inherit}
</style></head><body>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #f5f6fa; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #12172b">

  <div style="position: absolute; left: 20px; right: 20px; top: 24px">
    <button aria-label="Retour" style="width: 44px; height: 44px; border: none; border-radius: 22px; background: #ffffff; box-shadow: 0 2px 8px rgba(18,23,43,0.08); display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#12172b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
    </button>
  </div>

  <div style="position: absolute; left: 24px; right: 24px; top: 92px; font-size: 30px; line-height: 36px; font-weight: 400">Mot de passe<br><span style="font-weight: 800">oublié ?</span></div>
  <div style="position: absolute; left: 24px; right: 24px; top: 190px; font-size: 14px; line-height: 20px; color: #6b7287">Saisissez l'adresse e-mail de votre compte. Nous vous envoyons un lien valable 60 minutes.</div>

  <div style="position: absolute; left: 16px; right: 16px; top: 280px; box-sizing: border-box; padding: 22px 20px 24px; border-radius: 30px; background: #ffffff; border: none; box-shadow: 0 1px 3px rgba(18,23,43,0.06); display: flex; flex-direction: column; gap: 14px">
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #6b7287">Adresse e-mail
      <input type="email" value="aminata@exemple.sn" style="height: 52px; box-sizing: border-box; padding: 0 16px; border: none; border-radius: 18px; background: #f1f3f8; font-size: 15px; color: #12172b">
    </label>
    <button style="height: 54px; border: none; border-radius: 27px; background: #1d4ed8; color: #ffffff; font-size: 16px; font-weight: 700">Envoyer le lien</button>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; top: 506px; box-sizing: border-box; padding: 16px 18px; border-radius: 24px; background: #dbeafe; display: flex; gap: 12px; align-items: flex-start">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><path d="m5 12 5 5 9-10"/></svg>
    <div style="font-size: 13px; line-height: 19px; color: #1e3a8a">Si un compte correspond à cette adresse, un lien de réinitialisation vient d'être envoyé. Pensez à vérifier vos spams.</div>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 28px; text-align: center; font-size: 13px; line-height: 19px; color: #6b7287">Pas d'adresse e-mail sur votre compte ? Contactez le support Sopi.</div>

</div>
</body></html>
