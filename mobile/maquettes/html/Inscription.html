<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Inscription client</title><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
body{margin:0}
button,input{font-family:inherit}
</style></head><body>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #f5f6fa; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #12172b">

  <div style="position: absolute; left: 20px; right: 20px; top: 24px; display: flex; align-items: center; justify-content: space-between">
    <button aria-label="Retour" style="width: 44px; height: 44px; border: none; border-radius: 22px; background: #ffffff; box-shadow: 0 2px 8px rgba(18,23,43,0.08); display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#12172b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
    </button>
    <div style="font-size: 13px; color: #6b7287">Étape 1 sur 1</div>
  </div>

  <div style="position: absolute; left: 24px; right: 24px; top: 92px; font-size: 30px; line-height: 36px; font-weight: 400">Créer votre<br><span style="font-weight: 800">compte client</span></div>

  <div style="position: absolute; left: 16px; right: 16px; top: 190px; box-sizing: border-box; padding: 22px 20px 24px; border-radius: 30px; background: #ffffff; border: none; box-shadow: 0 1px 3px rgba(18,23,43,0.06); display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; gap: 10px">
      <label style="flex: 1; display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #6b7287">Prénom
        <input type="text" value="Aminata" style="height: 50px; box-sizing: border-box; padding: 0 14px; border: none; border-radius: 18px; background: #f1f3f8; font-size: 15px; color: #12172b; min-width: 0">
      </label>
      <label style="flex: 1; display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #6b7287">Nom
        <input type="text" value="Diallo" style="height: 50px; box-sizing: border-box; padding: 0 14px; border: none; border-radius: 18px; background: #f1f3f8; font-size: 15px; color: #12172b; min-width: 0">
      </label>
    </div>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #6b7287">Téléphone
      <input type="tel" value="+221 77 000 00 00" style="height: 50px; box-sizing: border-box; padding: 0 14px; border: none; border-radius: 18px; background: #f1f3f8; font-size: 15px; color: #12172b">
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #6b7287">E-mail (facultatif, utile pour récupérer votre compte)
      <input type="email" value="aminata@exemple.sn" style="height: 50px; box-sizing: border-box; padding: 0 14px; border: none; border-radius: 18px; background: #f1f3f8; font-size: 15px; color: #12172b">
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #6b7287">Mot de passe
      <input type="password" value="motdepasse" style="height: 50px; box-sizing: border-box; padding: 0 14px; border: none; border-radius: 18px; background: #f1f3f8; font-size: 15px; color: #12172b">
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #6b7287">Confirmer le mot de passe
      <input type="password" value="motdepasse" style="height: 50px; box-sizing: border-box; padding: 0 14px; border: none; border-radius: 18px; background: #f1f3f8; font-size: 15px; color: #12172b">
    </label>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 24px; display: flex; flex-direction: column; gap: 12px; align-items: center">
    <button style="width: 100%; height: 54px; border: none; border-radius: 27px; background: #1d4ed8; color: #ffffff; font-size: 16px; font-weight: 700">Créer mon compte</button>
    <div style="font-size: 14px; color: #6b7287">Déjà un compte ? <span style="font-weight: 700; color: #1d4ed8">Se connecter</span></div>
  </div>

</div>
</body></html>
