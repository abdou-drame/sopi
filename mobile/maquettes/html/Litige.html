<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Ouvrir un litige</title><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
body{margin:0}
button,textarea{font-family:inherit}
</style></head><body>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #f5f6fa; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #12172b">

  <div style="position: absolute; left: 20px; right: 20px; top: 24px">
    <button aria-label="Retour" style="width: 44px; height: 44px; border: none; border-radius: 22px; background: #ffffff; box-shadow: 0 2px 8px rgba(18,23,43,0.08); display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#12172b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
    </button>
  </div>

  <div style="position: absolute; left: 24px; right: 24px; top: 92px; font-size: 30px; line-height: 36px; font-weight: 400">Signaler un<br><span style="font-weight: 800">problème</span></div>

  <div style="position: absolute; left: 16px; right: 16px; top: 214px; box-sizing: border-box; padding: 20px; border: none; box-shadow: 0 1px 3px rgba(18,23,43,0.06); border-radius: 30px; background: #ffffff; display: flex; flex-direction: column; gap: 14px">
    <div style="font-size: 13px; color: #6b7287">Réservation : Salon Fatou · Coupe femme · 24 oct.</div>

    <div>
      <div style="font-size: 12px; font-weight: 600; color: #6b7287; margin-bottom: 8px">Que s'est-il passé ?</div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <span style="height: 38px; padding: 0 14px; border-radius: 19px; background: #1d4ed8; color: #ffffff; font-size: 13px; font-weight: 600; display: flex; align-items: center">Prestataire absent</span>
        <span style="height: 38px; padding: 0 14px; border-radius: 19px; border: none; background: #e9ecf3; font-size: 13px; font-weight: 600; display: flex; align-items: center">Service non conforme</span>
        <span style="height: 38px; padding: 0 14px; border-radius: 19px; border: none; background: #e9ecf3; font-size: 13px; font-weight: 600; display: flex; align-items: center">Problème de prix</span>
        <span style="height: 38px; padding: 0 14px; border-radius: 19px; border: none; background: #e9ecf3; font-size: 13px; font-weight: 600; display: flex; align-items: center">Autre</span>
      </div>
    </div>

    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #6b7287">Décrivez la situation
      <textarea style="height: 120px; box-sizing: border-box; padding: 14px; border: none; border-radius: 18px; background: #f1f3f8; font-size: 14px; color: #12172b; resize: none">Le prestataire ne s'est pas présenté au rendez-vous.</textarea>
    </label>

    <div>
      <div style="font-size: 12px; font-weight: 600; color: #6b7287; margin-bottom: 8px">Preuves (photos)</div>
      <div style="display: flex; gap: 10px">
        <button aria-label="Ajouter une photo" style="width: 64px; height: 64px; border: 2px dashed #8a90a2; border-radius: 18px; background: #f1f3f8; display: flex; align-items: center; justify-content: center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 24px; display: flex; flex-direction: column; gap: 10px">
    <button style="height: 54px; border: none; border-radius: 27px; background: #1d4ed8; color: #ffffff; font-size: 16px; font-weight: 700">Envoyer le signalement</button>
    <div style="text-align: center; font-size: 12px; color: #6b7287">Un administrateur examinera votre dossier.</div>
  </div>

</div>
</body></html>
