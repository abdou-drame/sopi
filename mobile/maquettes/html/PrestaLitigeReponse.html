<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Répondre à un signalement</title><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
body{margin:0}
button,input,textarea{font-family:inherit}
</style></head><body>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #f5f6fa; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #12172b">
  <div style="position: absolute; left: 20px; right: 20px; top: 24px; display: flex; align-items: center; justify-content: space-between">
    <button aria-label="Retour" style="width: 44px; height: 44px; border: none; border-radius: 22px; background: #ffffff; box-shadow: 0 2px 8px rgba(18,23,43,0.08); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#12172b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
  </div>
  <div style="position: absolute; left: 24px; right: 24px; top: 92px; font-size: 30px; line-height: 36px; font-weight: 400">Répondre au<br><span style="font-weight: 800">signalement</span></div>
  <div style="position: absolute; left: 16px; right: 16px; top: 214px; box-sizing: border-box; padding: 20px; border: none; box-shadow: 0 1px 3px rgba(18,23,43,0.06); border-radius: 30px; background: #ffffff; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; justify-content: space-between"><div style="font-size: 16px; font-weight: 700">Aminata D.</div><span style="height: 26px; padding: 0 12px; border-radius: 13px; background: #fef3c7; color: #92400e; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center">À traiter</span></div>
    <div style="font-size: 13px; color: #6b7287">Coupe femme · Sam. 24 oct., 10h00</div>
    <div><div style="font-size: 12px; font-weight: 600; color: #6b7287; margin-bottom: 6px">Motif</div><span style="height: 34px; padding: 0 14px; border-radius: 17px; background: #1d4ed8; color: #ffffff; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center">Prestataire absent</span></div>
    <div><div style="font-size: 12px; font-weight: 600; color: #6b7287; margin-bottom: 6px">Ce que dit le client</div><div style="font-size: 14px; line-height: 20px; color: #12172b">Le prestataire ne s'est pas présenté au rendez-vous.</div></div>
    <div><div style="font-size: 12px; font-weight: 600; color: #6b7287; margin-bottom: 8px">Preuves du client</div><div style="display: flex; gap: 10px"><div style="width: 64px; height: 64px; border-radius: 16px; background: linear-gradient(135deg,#c7d2fe,#bfdbfe)"></div><div style="width: 64px; height: 64px; border-radius: 16px; background: linear-gradient(135deg,#c7d2fe,#bfdbfe)"></div></div></div>
  </div>
  <div style="position: absolute; left: 16px; right: 16px; top: 562px; box-sizing: border-box; padding: 14px; border: none; box-shadow: 0 1px 3px rgba(18,23,43,0.06); border-radius: 30px; background: #ffffff; display: flex; flex-direction: column; gap: 14px">
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #6b7287">Votre réponse
      <textarea style="height: 88px; box-sizing: border-box; padding: 14px; border: none; border-radius: 18px; background: #f1f3f8; font-size: 14px; color: #12172b; resize: none">J'étais présent à l'heure convenue, le client n'est pas venu.</textarea>
    </label>
  </div>
  <div style="position: absolute; left: 16px; right: 16px; bottom: 24px; display: flex; flex-direction: column; gap: 10px"><button style="height: 54px; border: none; border-radius: 27px; background: #1d4ed8; color: #ffffff; font-size: 16px; font-weight: 700">Envoyer ma réponse</button><div style="text-align: center; font-size: 12px; color: #6b7287">Un administrateur examinera les deux versions.</div></div>

</div>
</body></html>
